onBadge(name,size=26) {\n  const content=name==='font'?'\u003cspan class=\"font-symbol\">가\u003c/span>':icon(name,size);\n  return `\u003cspan class=\"button-icon\" aria-hidden=\"true\">${content}\u003c/span>`;\n}\nfunction actionContent(text,name='arrow') {\n  return `\u003cspan class=\"button-label\">${text}\u003c/span>\u003cspan class=\"button-arrow\" aria-hidden=\"true\">${icon(name,28)}\u003c/span>`;\n}\nfunction selectionButton(action,value,title,detail='',price='',selected=false,extra='') {\n  const artwork=title.match(/^\u003csvg[\\s\\S]*?\u003c\\/svg>/)?.[0]||'';\n  const media=artwork?`\u003cspan class=\"choice-art\" aria-hidden=\"true\">${artwork}\u003c/span>`:'',label=artwork?title.slice(artwork.length):title;\n  return `\u003cbutton type=\"button\" id=\"${action}-${value}\" data-action=\"${action}\" data-value=\"${value}\" class=\"choice\" data-label=\"${esc(title.replace(/\u003csvg[\\s\\S]*?\u003c\\/svg>/g,'').replace(/\u003c[^>]*>/g,''))}\" aria-pressed=\"${selected}\" ${extra}>${media}\u003cspan class=\"choice-title\">${label}\u003c/span>${detail?`\u003cspan class=\"detail\">${detail}\u003c/span>`:''}${price?`\u003cspan class=\"price\">${price}\u003c/span>`:''}${selected?'\u003cspan class=\"tag\">✓ 선택됨\u003c/span>':''}\u003c/button>`;\n}\nfunction renderHeader() {\n  $('header').innerHTML=`\u003cdiv class=\"brand\">\u003cspan class=\"brand-name\">${esc(HangeolConfig.product.name)}\u003c/span>\u003cspan class=\"brand-caption\">${esc(currentStore().name)} · 연습 화면 · 시연용 가격\u003c/span>\u003c/div>${state.screen==='home'?'':`\u003cnav class=\"utility\" aria-label=\"사용 보조\">${button('voice',`${iconBadge('sound',22)}\u003cspan class=\"button-label\">소리 안내 ${state.voice?'켜짐':'꺼짐'}\u003c/span>`,'',`id=\"voice-toggle\" aria-pressed=\"${state.voice}\"`)}${button('font',`${iconBadge('font')}\u003cspan class=\"button-label\">글씨 크게 보기\u003c/span>`,'',`id=\"font-toggle\" aria-pressed=\"${state.large}\"`)}${button('help',`${iconBadge('help',22)}\u003cspan class=\"button-label\">도움이 필요해요\u003c/span>`,'','id=\"utility-help\"')}\u003c/nav>`}`;\n}\nfunction heading(title,description='',step='') {\n  const levels={place:1,find:2,list:2,type:3,side:4,drink:5,qty:6,cart:7,review:8,pay:9,config:3};\n  const n=levels[state.screen]||0;\n  return `${!['cart','review','pay'].includes(state.screen)?button('back',`${iconBadge('back',24)}\u003cspan class=\"button-label\">${state.editId?'바꾸지 않고 주문으로':'이전 화면으로'}\u003c/span>`,'secondary back','id=\"back-button\"'):''}\u003cdiv class=\"page-top\">\u003cdiv>${step?`\u003cp class=\"step-label\">${step}\u003c/p>`:''}\u003ch1 id=\"page-title\" tabindex=\"-1\">${title}\u003c/h1>${description?`\u003cp class=\"description\">${description}\u003c/p>`:''}\u003c/div>${!state.editId && state.active?.mode==='guided' && !['cart','review','pay'].includes(state.screen)?`\u003cdiv class=\"progress\" aria-hidden=\"true\">${Array.from({length:9},(_,i)=>`\u003ci class=\"${i\u003cn?'past':''}\">\u003c/i>`).join('')}\u003c/div>`:''}\u003c/div>`;\n}\nfunction aside() {\n  const d=state.draft;\n  const current = d ? `\n    \u003chr>\n    \u003cdiv class=\"aside-part\">\u003cstrong>${esc(getMenu(d.menuId).name)}\u003c/strong>\u003c/div>\n    \u003cp class=\"aside-part\">${d.type==='set'?'세트':d.type==='single'?'단품':'단품·세트 선택 전'}\u003c/p>\n    ${d.type==='set'?`\u003cp class=\"aside-part\">${esc(getMenu(d.sideId||'potato').name)}\u003c/p>\u003cp class=\"aside-part\">${esc(getMenu(d.drinkId||'cola').name)}\u003c/p>`:''}\n    \u003cp class=\"aside-part\">${d.qty}개\u003c/p>\u003chr>\n    \u003cp class=\"aside-label\">이 메뉴의 합계\u003c/p>\n    ${d.type?`\u003cstrong class=\"money\">${won(itemTotal(d))}\u003c/strong>`:'\u003cp class=\"muted\">구성을 고르면 금액을 표시해요.\u003c/p>'}\n  ` : `\u003chr>\u003cp>담은 메뉴 ${state.cart.length}가지\u003c/p>\u003cstrong class=\"money\">${won(cartTotal())}\u003c/strong>`;\n  return `\u003caside class=\"order-aside\" aria-label=\"지금 고른 내용\">\n    \u003ch2>지금 고른 내용\u003c/h2>\u003cp class=\"aside-label\">먹을 장소\u003c/p>\n    \u003cp>${placeName(state.place)}\u003c/p>${current}\n    \u003cp class=\"aside-note\">이전 화면으로 돌아가도 고른 내용은 남아 있어요.\u003c/p>\n  \u003c/aside>`;\n}\nfunction work(content){return `\u003cdiv class=\"work-layout\">\u003csection>${content}\u003c/section>${aside()}\u003c/div>`;}\nfunction nextButton(action,text,disabled=false) {return `\u003cdiv class=\"next-row\">${button(action,actionContent(text),'primary',`data-next=\"true\" ${disabled?'disabled':''}`)}\u003c/div>`;}\nfunction pickedMenu() {const m=getMenu(state.draft.menuId);return `\u003cdiv class=\"picked-menu\">${food(m.art)}\u003cdiv>\u003cstrong>${esc(m.name)}\u003c/strong>\u003cbr>\u003cspan>${esc(m.desc)}\u003c/span>\u003c/div>\u003c/div>`;}\nfunction typeOptions() {\n  const d=state.draft,m=getMenu(d.menuId);\n  return `\u003cdiv class=\"option-grid\">${selectionButton('type','single','단품','버거만 주문합니다.',won(m.price),d.type==='single')}${selectionButton('type','set','세트','버거 + 사이드 + 음료',`기본 세트 ${won(m.price+SET_EXTRA)}`,d.type==='set')}\u003c/div>\u003cp class=\"hint\">기본 세트에는 포테이토와 콜라가 들어 있어요. 다른 구성으로 바꾸면 추가금이 붙을 수 있어요.\u003c/p>`;\n}\nfunction sideOrDrinkOptions(category) {\n  const field=category==='side'?'sideId':'drinkId';\n  const action=category==='side'?'side':'drink';\n  const base=category==='side'?'potato':'cola';\n  return `\u003cdiv class=\"option-grid\">${MENU.filter(m=>m.category===category).map(m=>selectionButton(action,m.id,`${food(m.art)}\u003cspan>${esc(m.name)}\u003c/span>`,`${esc(m.desc)}${m.id===base?'\u003cbr>\u003cspan class=\"default\">'+(state.draft[field]===m.id?'기본 선택':'기본 구성')+'\u003c/span>':''}`,m.extra?`${won(m.extra)} 추가`:'추가금 없음',state.draft[field]===m.id)).join('')}\u003c/div>`;\n}\nfunction quantityContent() {\n  if (!state.draft.type) return '\u003cp class=\"hint\">먼저 단품 또는 세트를 골라 주세요. 그다음 수량과 합계를 확인할 수 있어요.\u003c/p>';\n  return `\u003cdiv class=\"quantity-box\">\u003cp>같은 구성은 1개부터 9개까지 고를 수 있어요.\u003c/p>\u003cdiv class=\"quantity-controls\">${button('minus','−','',`id=\"qty-minus\" aria-label=\"수량 1개 줄이기\" ${state.draft.qty\u003c=1?'disabled':''}`)}\u003cstrong class=\"quantity-number\" aria-live=\"polite\">${state.draft.qty}\u003cspan style=\"font-size:.45em\">개\u003c/span>\u003c/strong>${button('plus','+','',`id=\"qty-plus\" aria-label=\"수량 1개 늘리기\" ${state.draft.qty>=9?'disabled':''}`)}\u003c/div>\u003cp class=\"muted\">1개 ${won(unitPrice(state.draft))}\u003c/p>\u003cp class=\"total-large\">합계 \u003cstrong class=\"money\">${won(itemTotal(state.draft))}\u003c/strong>\u003c/p>\u003c/div>`;\n}\nfunction menuList() {\n  const normal=state.active.mode==='normal';\n  const choices=MENU.filter(m=>normal?m.category===state.tab:state.group==='all'?m.category==='burger':['side','drink'].includes(state.group)?m.category===state.group:m.group===state.group);\n  const category=GROUPS.find(g=>g.id===state.group)?.name || '메뉴';\n  return heading(normal?'먹고 싶은 메뉴를 골라 주세요.':category,normal?'종류를 눌러 메뉴를 둘러볼 수 있어요.':'메뉴를 누르면 구성을 고를 수 있어요.','메뉴 고르기')+work(`${normal?`\u003cdiv class=\"tabs\" aria-label=\"메뉴 종류\">${[['burger','버거'],['side','사이드'],['drink','음료']].map(([id,name])=>button('tab',name,'',`id=\"tab-${id}\" data-value=\"${id}\" aria-pressed=\"${state.tab===id}\"`)).join('')}\u003c/div>`:button('other-group','다른 종류 보기','secondary','style=\"margin-bottom:20px\"')}\u003cdiv class=\"option-grid three menu-grid\">${choices.map(m=>selectionButton('menu',m.id,`${food(m.art)}\u003cspan>${esc(m.name)}\u003c/span>`,esc(m.desc),`${m.category==='burger'?'단품 ':''}${won(m.price)}`,state.draft?.menuId===m.id)).join('')}\u003c/div>`);\n}\nfunction cartItem(item,editable=true) {\n  const m=getMenu(item.menuId,item.store);\n  return `\u003carticle class=\"cart-item\">\u003cdiv class=\"cart-picture\" aria-hidden=\"true\">${food(m.art)}\u003c/div>\u003cdiv class=\"cart-item-copy\">\u003ch2>${esc(m.name)}\u003c/h2>\u003cp class=\"components\">${esc(components(item))}\u003c/p>\u003cdiv class=\"item-bottom\">\u003cspan>수량 \u003cstrong>${item.qty}개\u003c/strong>\u003c/span>\u003cstrong class=\"money\">${won(itemTotal(item))}\u003c/strong>\u003c/div>${editable?`\u003cdiv class=\"cart-actions\">${button('edit','메뉴 바꾸기','secondary',`id=\"edit-${item.id}\" data-id=\"${item.id}\" aria-label=\"${esc(m.name)} 바꾸기\"`)}${button('delete','삭제하기','text-button danger',`data-id=\"${item.id}\" aria-label=\"${esc(m.name)} 삭제하기\"`)}\u003c/div>`:''}\u003c/div>\u003c/article>`;\n}\nfunction locationBar(editable=true) {return `\u003cdiv class=\"location-bar\">\u003cdiv class=\"location-info\">${iconBadge(state.place==='store'?'store':'bag')}\u003cdiv class=\"location-copy\">\u003csmall>먹을 장소\u003c/small>\u003cstrong>${placeName(state.place)}\u003c/strong>\u003c/div>\u003c/div>${editable?button('edit-place','먹을 장소 바꾸기','secondary'):''}\u003c/div>`;}\n\n// 장바구니·최종 확인·결제에서 다음 버튼과 안내 이름을 함께 관리합니다.\nconst CHECKOUT = {\n  cart:{action:'to-review',label:'주문 확인하고 결제하기',note:'다음: 주문 내용을 한 번 더 확인해요.'},\n  review:{action:'to-pay',label:'맞아요 · 결제 화면으로',note:'다음: 실제 결제 없이 주문을 연습해요.'},\n  pay:{action:'pay',label:'모의 결제 완료',note:'실제 결제 없이 주문 연습이 끝나요.'}\n};\nfunction checkoutProgress() {\n  const steps=[['cart','담은 메뉴','메뉴와 수량 보기'],['review','최종 확인','주문이 맞는지 보기'],['pay','결제 연습','버튼을 눌러 마치기']];\n  return `\u003col class=\"checkout-progress\" aria-label=\"주문 완료까지 남은 순서\">${steps.map(([screen,title,desc],index)=>`\u003cli ${state.screen===screen?'aria-current=\"step\"':''}>\u003cspan class=\"step-number\" aria-hidden=\"true\">${index+1}\u003c/span>\u003cspan>${title}\u003csmall>${desc}\u003c/small>\u003c/span>\u003c/li>`).join('')}\u003c/ol>`;\n}\nfunction checkoutDock(screen) {\n  const info=CHECKOUT[screen];\n  const label=screen==='pay'&&state.paymentError?'다시 시도':info.label;\n  const note=screen==='pay'&&state.paymentError?'담은 메뉴를 그대로 두고 다시 결제 연습을 해요.':info.note;\n  return `\u003csection class=\"checkout-dock\" aria-label=\"주문 금액과 다음 행동\">\u003cdiv class=\"checkout-dock-inner\">\u003cdiv class=\"checkout-total\">\u003cdiv>\u003cp class=\"checkout-amount-label\">전체 주문 합계\u003c/p>\u003cp class=\"checkout-count\">총 ${state.cart.reduce((sum,i)=>sum+i.qty,0)}개 · 실제 결제 없음\u003c/p>\u003c/div>\u003cstrong class=\"money checkout-amount\">${won(cartTotal())}\u003c/strong>\u003c/div>\u003cdiv>${button(info.action,actionContent(label),'primary',`data-next=\"true\" ${state.cart.length?'':'disabled'}`)}\u003cp class=\"checkout-next-note\">${note}\u003c/p>\u003c/div>\u003c/div>\u003c/section>`;\n}\n// 하단 고정 영역의 실제 높이만큼 여백을 두어 큰 글씨에서도 내용을 가리지 않습니다.\nfunction syncCheckoutSpace() {\n  if(!document.documentElement?.style)return;\n  const headerHeight=$('header')?.getBoundingClientRect?.().height||0;\n  document.documentElement.style.setProperty('--header-space',`${Math.ceil(headerHeight)+16}px`);\n  const dock=$('main').querySelector('.checkout-dock');\n  document.documentElement.style.setProperty('--checkout-space',dock?`${Math.ceil(dock.getBoundingClientRect().height)+16}px`:'0px');\n}\nconst checkoutObserver=typeof ResizeObserver==='function'?new ResizeObserver(syncCheckoutSpace):null;\nconst headerObserver=typeof ResizeObserver==='function'?new ResizeObserver(syncCheckoutSpace):null;\nheaderObserver?.observe($('header'));\nwindow.addEventListener?.('resize',syncCheckoutSpace);\nfunction cartScreen(review=false) {\n  const screen=review?'review':'cart';\n  return `\u003cdiv class=\"checkout-content\">${checkoutProgress()}${heading(review?'이대로 주문할까요?':'담은 메뉴가 맞나요?',state.cart.length?(review?'장소와 메뉴가 맞으면 아래 ‘맞아요 · 결제 화면으로’를 눌러 주세요.':'다 골랐으면 아래 ‘주문 확인하고 결제하기’를 눌러 주세요.'):'‘다른 메뉴 더 고르기’를 눌러 메뉴를 담아 주세요.',review?'마지막으로 주문 확인':'메뉴와 수량 확인')}${locationBar()}\u003csection aria-label=\"담은 메뉴\">${state.cart.length?state.cart.map(i=>cartItem(i)).join(''):'\u003cdiv class=\"empty\">\u003ch2>아직 담은 메뉴가 없어요.\u003c/h2>\u003cp class=\"description\">‘다른 메뉴 더 고르기’를 눌러 주세요.\u003c/p>\u003c/div>'}\u003c/section>${review&&state.cart.length?button('to-cart','장바구니로 돌아가기','secondary cart-return'):button('more',`${iconBadge('plus')}\u003cspan class=\"button-label\">다른 메뉴 더 고르기\u003c/span>`,'secondary add-menu')}\u003c/div>${checkoutDock(screen)}`;\n}\nfunction renderBase(resetFocus=false) {\n  const oldY=window.scrollY,activeId=document.activeElement?.id;document.body.dataset.foodScreen=state.screen;\n  document.body.classList.toggle('large',state.large);document.body.classList.toggle('highlight',state.highlight);document.body.classList.toggle('screen-home',state.screen==='home');document.body.classList.toggle('has-checkout',!!CHECKOUT[state.screen]);renderHeader();\n  let html='';\n  switch(state.screen){\n    case 'home':html=`\u003csection class=\"home food-welcome\">\u003cdiv class=\"food-welcome-copy\">\u003cp class=\"eyebrow\">음식 주문 연습\u003c/p>\u003ch1 id=\"page-title\" tabindex=\"-1\">주문을 연습해 볼까요?\u003c/h1>\u003cp class=\"instruction\">먹을 장소부터 메뉴와 결제까지,\u003cbr>내 속도로 하나씩 골라 보세요.\u003c/p>\u003cdiv class=\"home-start\">${button('start',actionContent('주문 시작'),'primary','id=\"start-button\" data-next=\"true\"')}\u003c/div>\u003cdiv class=\"home-tools\">${button('speak',`${iconBadge('sound')}\u003cspan class=\"button-label\">설명을 소리로 듣기\u003c/span>`,'','id=\"home-speak\"')}${button('font',`${iconBadge('font')}\u003cspan class=\"button-label\">글씨 크게 보기\u003c/span>`,'','id=\"home-font\" aria-pressed=\"'+state.large+'\"')}\u003c/div>\u003c/div>\u003cdiv class=\"food-welcome-art\" aria-hidden=\"true\">\u003cdiv class=\"food-art-orbit\">\u003c/div>${food('cola')}${food('fries')}${food('burger')}\u003c/div>\u003cdiv class=\"home-path\">\u003cp class=\"description\">이 순서로 연습해요\u003c/p>\u003col aria-label=\"주문 순서\">\u003cli>\u003cspan class=\"path-number\">1\u003c/span>먹을 장소 고르기\u003c/li>\u003cli>\u003cspan class=\"path-number\">2\u003c/span>메뉴와 구성 고르기\u003c/li>\u003cli>\u003cspan class=\"path-number\">3\u003c/span>주문 확인하고 마치기\u003c/li>\u003c/ol>\u003c/div>\u003cp class=\"touch\">연습 화면입니다. 실제 주문이나 결제는 진행하지 않습니다.\u003c/p>\u003c/section>`;break;\n    case 'place':html=heading('어디에서 드시나요?','매장에서 먹을지, 포장할지 골라 주세요.',state.placeReturn?'먹을 장소 바꾸기':'먹을 장소 선택')+work(`\u003cdiv class=\"option-grid place-grid\">${selectionButton('place','store',`${icon('store',56)}\u003cspan>${esc(currentStore().labels.store)}\u003c/span>`,'매장 안에서 드실 때','',state.place==='store')}${selectionButton('place','takeout',`${icon('bag',56)}\u003cspan>${esc(currentStore().labels.takeout)}\u003c/span>`,'가지고 나가서 드실 때','',state.place==='takeout')}\u003c/div>${nextButton('place-next',state.placeReturn?'먹을 장소 변경 완료':'먹을 장소 선택 완료',!state.place)}`);break;\n    case 'find':html=heading('어떤 버거를 찾으세요?','사이드나 음료만 주문할 수도 있어요.','메뉴 찾기')+work(`\u003cdiv class=\"option-grid\">${GROUPS.map(g=>selectionButton('group',g.id,food(({beef:'burger',shrimp:'shrimp',chicken:'chicken',all:'burger',side:'fries',drink:'cola'})[g.id])+esc(g.name),esc(g.desc),'',false)).join('')}\u003c/div>`);break;\n    case 'list':html=menuList();break;\n    case 'type':html=heading('버거만 주문하시나요,\u003cbr>세트로 주문하시나요?',state.editId?'이 메뉴의 구성만 바뀌어요. 수량과 다른 메뉴는 유지돼요.':'단품과 세트 중 하나를 골라 주세요.',state.editId?'단품·세트 바꾸기':'구성 선택')+work(pickedMenu()+typeOptions()+nextButton(state.editId?'save':'type-next',state.editId?'단품·세트 변경 저장':'단품·세트 선택 완료',!state.draft.type));break;\n    case 'side':html=heading('함께 먹을 음식을 골라 주세요.','사이드는 버거와 함께 먹는 곁들임 음식이에요.',state.editId?'사이드 바꾸기':'사이드 선택')+work(sideOrDrinkOptions('side')+nextButton(state.editId?'save':'side-next',state.editId?'사이드 변경 저장':'사이드 선택 완료'));break;\n    case 'drink':html=heading('마실 음료를 골라 주세요.','음료를 바꿔도 버거와 사이드, 수량은 그대로예요.',state.editId?'음료 바꾸기':'음료 선택')+work(sideOrDrinkOptions('drink')+nextButton(state.editId?'save':'drink-next',state.editId?'음료 변경 저장':'음료 선택 완료'));break;\n    case 'qty':html=heading('몇 개 주문하시나요?','− 또는 + 버튼을 눌러 수량을 바꿀 수 있어요.',state.editId?'수량 바꾸기':'수량 선택')+work(pickedMenu()+quantityContent()+nextButton('save',state.editId?'수량 변경 저장':'이 메뉴를 주문에 담기'));break;\n    case 'config':html=heading('메뉴 구성을 골라 주세요.','구성과 수량을 고른 뒤 ‘이 메뉴를 주문에 담기’를 눌러 주세요.','메뉴 구성')+work(pickedMenu()+(getMenu(state.draft.menuId).category==='burger'?`\u003csection class=\"config-section\">\u003ch2>단품 또는 세트\u003c/h2>${typeOptions()}\u003c/section>${state.draft.type==='set'?`\u003csection class=\"config-section\">\u003ch2>함께 먹을 음식\u003c/h2>\u003cp class=\"description\" style=\"margin-bottom:15px\">사이드는 버거와 함께 먹는 곁들임 음식이에요.\u003c/p>${sideOrDrinkOptions('side')}\u003c/section>\u003csection class=\"config-section\">\u003ch2>마실 음료\u003c/h2>${sideOrDrinkOptions('drink')}\u003c/section>`:''}`:'')+`\u003csection class=\"config-section\">\u003ch2>주문 수량\u003c/h2>${quantityContent()}\u003c/section>`+nextButton('save','이 메뉴를 주문에 담기',!state.draft.type));break;\n    case 'cart':html=cartScreen();break;\n    case 'review':html=cartScreen(true);break;\n    case 'pay':html=`\u003cdiv class=\"checkout-content\">${checkoutProgress()}${heading('결제 연습을 마칠까요?',state.paymentError?'아래 ‘다시 시도’를 누르면 이어서 완료할 수 있어요.':'아래 ‘모의 결제 완료’ 버튼을 누르면 주문 연습이 끝나요.','마지막 단계')}\u003csection class=\"pay-card\">\u003cdiv class=\"pay-intro\">${iconBadge('check',34)}\u003ch2>실제 결제 없이 주문을 연습하는 화면입니다.\u003c/h2>\u003c/div>\u003cdiv class=\"option-grid payment-choices\">${selectionButton('payment-method','card','카드로 결제 연습','실제 카드 입력 없음','',state.paymentMethod==='card')}${selectionButton('payment-method','cash','현금으로 결제 연습','실제 돈을 내지 않아요.','',state.paymentMethod==='cash')}\u003c/div>\u003cdiv class=\"pay-checks\">\u003cp>${icon('check',24)}\u003cspan>카드번호나 개인정보를 입력하지 않아요.\u003c/span>\u003c/p>\u003cp>${icon('check',24)}\u003cspan>버튼을 누르면 주문 연습만 완료돼요.\u003c/span>\u003c/p>\u003c/div>${state.paymentError?'\u003cdiv class=\"error-box\" role=\"alert\">\u003ch2>결제가 완료되지 않았어요.\u003c/h2>\u003cp>메뉴와 수량은 그대로 남아 있어요.\u003cbr>아래 ‘다시 시도’를 눌러 주세요.\u003c/p>\u003c/div>':''}${button('to-review-back','주문 내용 다시 보기','secondary')}\u003c/section>\u003c/div>${checkoutDock('pay')}`;break;\n    case 'done':html=`\u003cdiv class=\"done-title\">\u003cdiv class=\"success-icon\">${icon('check',42)}\u003c/div>\u003ch1 id=\"page-title\" tabindex=\"-1\">주문을 마쳤어요.\u003c/h1>\u003cp>주문 연습이 끝났어요. 실제 주문이나 결제는 진행되지 않았어요.\u003c/p>\u003c/div>${locationBar(false)}\u003cdiv class=\"cart-layout\">\u003csection>${state.cart.map(i=>cartItem(i,false)).join('')}\u003c/section>\u003caside class=\"total-panel\">\u003cp>전체 주문 합계\u003c/p>\u003cp class=\"money total-large\">${won(cartTotal())}\u003c/p>${button('new','새 주문 연습하기','primary','data-next=\"true\"')}\u003c/aside>\u003c/div>`;break;\n  }\n  if(state.active)html+=`\u003cdiv style=\"margin-top:28px\">${button('reset','주문 취소하고 처음으로','text-button')}\u003c/div>`;\n  $('main').innerHTML=html;\n  checkoutObserver?.disconnect();\n  syncCheckoutSpace();\n  const checkoutElement=$('main').querySelector('.checkout-dock');\n  if(checkoutElement)checkoutObserver?.observe(checkoutElement);\n  if(state.highlight){const next=$('main').querySelector('[data-next=true]:not(:disabled)');if(!next)$('main').querySelectorAll('.choice').forEach(b=>b.setAttribute('data-next','true'));}\n  if(resetFocus){window.scrollTo(0,0);$('page-title')?.focus({preventScroll:true});}\n  else {if(activeId)$(activeId)?.focus({preventScroll:true});window.scrollTo(0,oldY);}\n}\n\n// 6. 화면별 글·소리 안내. 음성은 이용자가 켰을 때에만 재생합니다.\nfunction legacyGuideText() {\n  const editing=!!state.editId;\n  const guides={\n    home:'화면 가운데 있는 ‘주문 시작’ 버튼을 눌러 주세요. 먹을 장소와 메뉴부터 차례로 선택할 수 있어요.',\n    place:`매장에서 먹을지, 포장할지 골라 주세요. 고른 뒤 ‘${state.placeReturn?'먹을 장소 변경 완료':'먹을 장소 선택 완료'}’를 눌러 주세요.`,\n    find:'찾는 버거의 종류를 눌러 주세요. 사이드나 음료만 주문하는 버튼도 있어요.',\n    list:'먹고 싶은 메뉴 이름을 눌러 주세요. 다른 종류도 둘러볼 수 있어요.',\n    type:`단품은 버거만, 세트는 사이드와 음료가 함께 나오는 구성이에요. 고른 뒤 ‘${editing?'단품·세트 변경 저장':'단품·세트 선택 완료'}’를 눌러 주세요.`,\n    side:`함께 먹을 음식을 고른 뒤 ‘${editing?'사이드 변경 저장':'사이드 선택 완료'}’를 눌러 주세요. 포테이토는 감자튀김이에요.`,\n    drink:`마실 음료를 고른 뒤 ‘${editing?'음료 변경 저장':'음료 선택 완료'}’를 눌러 주세요.`,\n    qty:`마이너스나 플러스 버튼으로 수량을 고른 뒤 ‘${editing?'수량 변경 저장':'이 메뉴를 주문에 담기'}’를 눌러 주세요.`,\n    config:'구성과 수량을 고른 뒤 ‘이 메뉴를 주문에 담기’를 눌러 주세요.',\n    cart:state.cart.length?`메뉴와 수량을 읽어 주세요. 고칠 내용은 ‘메뉴 바꾸기’를, 다 골랐으면 화면 아래 ‘${CHECKOUT.cart.label}’를 눌러 주세요.`:'‘다른 메뉴 더 고르기’를 눌러 메뉴를 골라 주세요.',\n    review:state.cart.length?`먹을 장소와 메뉴가 맞나요? 바꿀 내용은 ‘메뉴 바꾸기’를 눌러 주세요. 모두 맞으면 화면 아래 ‘${CHECKOUT.review.label}’를 눌러 주세요.`:'‘다른 메뉴 더 고르기’를 눌러 메뉴를 담아 주세요.',\n    pay:state.paymentError?'담은 메뉴는 그대로 남아 있어요. 화면 아래 ‘다시 시도’를 눌러 주문을 이어가 주세요.':`카드번호를 입력하지 않아도 돼요. 화면 아래 ‘${CHECKOUT.pay.label}’를 누르면 주문 연습이 끝나요.`,\n    done:'주문 연습을 마쳤어요. 실제 주문이나 결제는 진행되지 않았어요. ‘새 주문 연습하기’로 다시 연습할 수 있어요.'\n  };\n  return guides[state.screen] || '';\n}\nfunction legacyStopSpeech(){try{window.speechSynthesis?.cancel();}catch(e){}}\nfunction legacySpeak(text,requested=true) {\n  if(requested && state.active)state.active.audioRequests++;\n  if(!('speechSynthesis' in window) || !('SpeechSynthesisUtterance' in window)){toast('이 기기에서는 소리 안내를 사용할 수 없어요. 화면의 글 안내를 따라 주문할 수 있어요.');return false;}\n  stopSpeech();\n  try{const utterance=new SpeechSynthesisUtterance(text);utterance.lang='ko-KR';utterance.rate=.82;const voice=speechSynthesis.getVoices().find(v=>/^ko/i.test(v.lang));if(voice)utterance.voice=voice;utterance.onerror=e=>{if(!['interrupted','canceled'].includes(e.error)){state.voice=false;render();toast('소리가 나오지 않으면 화면의 글 안내를 따라 주세요.');}};speechSynthesis.speak(utterance);return true;}\n  catch(e){toast('소리 안내를 재생하지 못했어요. 화면의 글로 주문을 이어갈 수 있어요.');return false;}\n}\nfunction toast(message){clearTimeout(toastTimer);$('toast').textContent=message;toastTimer=setTimeout(()=>$('toast').textContent='',6500);}\n\n// 7. 도움·수정·관리자 창. 기본 dialog가 뒤쪽 조작을 막고 초점을 가둡니다.\nfunction openDialogBase(kind,title,content,admin=false) {\n  stopSpeech();if(!$('dialog').open)returnFocus=document.activeElement;dialogKind=kind;\n  $('dialog').className=admin?'admin-dialog':'';\n  $('dialog').innerHTML=`\u003cdiv class=\"dialog-head\">\u003ch2 id=\"dialog-title\">${title}\u003c/h2>${button('close','닫기','dialog-close','id=\"dialog-close\"')}\u003c/div>\u003cdiv class=\"dialog-body\">${content}\u003c/div>`;\n  if(!$('dialog').open)$('dialog').showModal();$('dialog-close').focus({preventScroll:true});\n}\nfunction closeDialogBase(){if($('dialog').open)$('dialog').close();dialogKind=null;stopSpeech();returnFocus?.isConnected&&returnFocus.focus({preventScroll:true});}\nfunction openHelp(){if(state.active)state.active.helpCount++;openDialog('help','이 화면에서는 이렇게 해 주세요.',`\u003cp>${esc(guideText())}\u003c/p>${state.staff?'\u003cp class=\"admin-note\">시연: 직원에게 도움을 요청한 상태예요. 실제로 연락되지는 않아요.\u003c/p>':''}\u003cdiv class=\"dialog-buttons\">${button('help-speak','안내 다시 듣기','primary')}${button('highlight','누를 버튼 표시하기','secondary')}\u003c/div>\u003cdiv class=\"dialog-buttons\">${button('help-mute','소리 안내 끄기','secondary')}${button('staff','직원 도움 요청 시연','secondary')}\u003c/div>`);}\nfunction editDialog(id){const item=state.cart.find(i=>i.id===id);if(!item)return;state.returnScreen=state.screen;openDialog('edit','어떤 항목을 바꿀까요?',`\u003cp>\u003cstrong>${esc(getMenu(item.menuId).name)}\u003c/strong>\u003cbr>${esc(components(item))} · ${item.qty}개\u003c/p>\u003cdiv class=\"edit-grid\">${item.type==='set'?button('edit-field','음료 바꾸기','secondary',`data-id=\"${id}\" data-value=\"drink\"`)+button('edit-field','사이드 바꾸기','secondary',`data-id=\"${id}\" data-value=\"side\"`):''}${button('edit-field','수량 바꾸기','secondary',`data-id=\"${id}\" data-value=\"qty\"`)}${getMenu(item.menuId).category==='burger'?button('edit-field','단품·세트 바꾸기','secondary',`data-id=\"${id}\" data-value=\"type\"`):''}\u003c/div>\u003cp class=\"admin-note\">여기서 고른 항목만 바꿔요. 다른 메뉴는 그대로 남아요.\u003c/p>`);}\nfunction confirmDialog(kind,title,description,action,label){pending=kind;openDialog('confirm',title,`\u003cp>${description}\u003c/p>\u003cdiv class=\"dialog-buttons\">${button('close','그대로 이어하기','secondary')}${button(action,label,'primary')}\u003c/div>`);}\nfunction requestReset(){if(state.active)confirmDialog('reset','지금 주문을 취소하고\u003cbr>처음으로 돌아갈까요?','담은 메뉴는 지워지고, 이번 시도는 중도 종료로 기록돼요.','confirm-reset','주문 취소하고 처음으로');else{state.cart=[];state.history=[];navigate('home',false);}}\nfunction duration(ms){const seconds=Math.round(ms/1000);return seconds\u003c60?`${seconds}초`:`${Math.floor(seconds/60)}분 ${seconds%60}초`;}\nfunction dateText(ms){return new Date(ms).toLocaleString('ko-KR',{hour12:false});}\nfunction summary(cart){return cart.map(i=>`${getMenu(i.menuId,i.store).name} ${components(i)} ${i.qty}개`).join(' / ');}\nfunction adminContentBase() {\n  const active=state.active,lock=active?'disabled':'';\n  const task=active?.task || settings.task;\n  return `\u003cp>발표자와 관찰자를 위한 화면입니다.\u003c/p>${active?`\u003cp class=\"admin-note\">주문 진행 중: ${esc(active.participant)} · 과제 ${active.task} · ${modeName(active.mode)}\u003cbr>참여자 코드와 과제는 이번 주문이 끝난 뒤 바꿀 수 있어요.\u003c/p>`:''}\u003cform id=\"admin-form\" class=\"admin-form\">\u003clabel>익명 참여자 코드\u003cinput id=\"participant-input\" name=\"participant\" value=\"${esc(active?.participant||settings.participant)}\" pattern=\"P[0-9]{2,4}\" maxlength=\"5\" aria-describedby=\"participant-note\" ${lock}>\u003csmall id=\"participant-note\">P01, P02처럼 입력해 주세요.\u003c/small>\u003c/label>\u003clabel>시연 과제\u003cselect name=\"task\" id=\"task-input\" ${lock}>\u003coption value=\"A\" ${task==='A'?'selected':''}>과제 A — 기본 세트 주문\u003c/option>\u003coption value=\"B\" ${task==='B'?'selected':''}>과제 B — 음료와 수량 변경\u003c/option>\u003c/select>\u003c/label>\u003clabel>다음 주문 방식\u003cselect name=\"mode\" id=\"mode-input\">\u003coption value=\"guided\" ${settings.mode==='guided'?'selected':''}>도움 주문 — 단계별 선택\u003c/option>\u003coption value=\"normal\" ${settings.mode==='normal'?'selected':''}>일반 주문 — 한 화면에서 구성 선택\u003c/option>\u003c/select>\u003c/label>\u003clabel class=\"check\">\u003cinput type=\"checkbox\" name=\"paymentError\" id=\"payment-error-input\" ${settings.paymentError?'checked':''}>다음 모의 결제에서 오류 1회 발생\u003c/label>\u003cdiv class=\"wide\">${button('save-admin','다음 시연 설정 저장','primary')}${adminError?`\u003cp class=\"form-error\" role=\"alert\">${esc(adminError)}\u003c/p>`:''}\u003c/div>\u003c/form>\u003cdiv class=\"task-text\">\u003cstrong id=\"task-name\">과제 ${task}\u003c/strong>\u003cp id=\"task-copy\" style=\"margin-top:8px\">${TASKS[task]}\u003c/p>\u003c/div>\u003cp class=\"admin-note\">설정은 다음 ‘주문 시작’에 적용됩니다. 결제 오류 설정은 다음 주문에 한 번만 적용되고 자동으로 꺼집니다.\u003c/p>${active?`\u003ch3>이번 시도의 관찰 오류\u003c/h3>\u003clabel>관찰자가 확인한 오류 횟수 \u003cinput id=\"active-errors\" class=\"record-errors\" type=\"number\" min=\"0\" max=\"999\" step=\"1\" value=\"${active.observerErrors}\">\u003c/label> ${button('save-errors','오류 횟수 저장','secondary')}`:''}\u003ch3>방식별 비교\u003c/h3>\u003cp style=\"margin-bottom:12px\">평균 시간은 과제 일치 여부와 관계없이 \u003cstrong>모의 결제를 완료한 주문\u003c/strong>만 계산합니다. 중도 종료는 제외합니다.\u003c/p>\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>주문 방식\u003c/th>\u003cth>전체 시도 수\u003c/th>\u003cth>과제와 일치하게 완료\u003c/th>\u003cth>완료 주문 평균 시간\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${['normal','guided'].map(mode=>{const attempts=records.filter(r=>r.mode===mode);const complete=attempts.filter(r=>r.status==='completed');return `\u003ctr>\u003cth>${modeName(mode)}\u003c/th>\u003ctd>${attempts.length}회\u003c/td>\u003ctd>${complete.filter(r=>r.matched).length}회\u003c/td>\u003ctd>${complete.length?duration(complete.reduce((n,r)=>n+r.durationMs,0)/complete.length):'완료 기록 없음'}\u003c/td>\u003c/tr>`;}).join('')}\u003c/tbody>\u003c/table>\u003c/div>\u003cp style=\"margin-top:10px;font-size:.85em\">전체 시도 수는 완료와 중도 종료 기록의 합입니다. 진행 중인 주문은 아직 집계하지 않습니다.\u003c/p>\u003ch3>개별 시연 기록\u003c/h3>${records.length?`\u003cdiv class=\"table-wrap\">\u003ctable>\u003cthead>\u003ctr>\u003cth>참여자 / 과제 / 방식\u003c/th>\u003cth>시각 / 소요 시간\u003c/th>\u003cth>결과 / 최종 주문\u003c/th>\u003cth>도움 / 소리 / 변경\u003c/th>\u003cth>관찰 오류\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>${[...records].reverse().map(r=>`\u003ctr>\u003ctd>${esc(r.participant)} · ${r.task}\u003cbr>${modeName(r.mode)}\u003c/td>\u003ctd>${esc(dateText(r.startMs))}\u003cbr>${duration(r.durationMs)}\u003c/td>\u003ctd>\u003cstrong>${r.status==='completed'?'완료':'중도 종료'}\u003c/strong> · ${r.status==='completed'?(r.matched?'과제 일치':'과제 불일치'):'완료하지 않음'}\u003cdiv class=\"record-detail\">${placeName(r.place)}\u003cbr>${esc(summary(r.cart)||'담은 메뉴 없음')}\u003cbr>${won(r.total)}\u003c/div>\u003c/td>\u003ctd>도움 ${r.helpCount}회\u003cbr>소리 요청 ${r.audioRequests}회\u003cbr>선택 변경 ${r.changes}회\u003c/td>\u003ctd>\u003cinput type=\"number\" class=\"record-errors\" min=\"0\" max=\"999\" step=\"1\" value=\"${r.observerErrors}\" data-record=\"${esc(r.id)}\" aria-label=\"${esc(r.participant)} ${esc(dateText(r.startMs))} 관찰 오류 횟수\">\u003c/td>\u003c/tr>`).join('')}\u003c/tbody>\u003c/table>\u003c/div>\u003cp style=\"margin-top:10px;font-size:.85em\">개별 기록의 관찰 오류는 값을 바꾼 뒤 입력 칸에서 벗어나면 저장됩니다.\u003c/p>`:'\u003cp class=\"no-results\">아직 시연 기록이 없습니다. 주문을 시작하고 완료하거나 중도 종료하면 기록됩니다.\u003c/p>'}\u003cdiv class=\"admin-actions\">${button('csv','결과 CSV 내려받기','secondary',records.length?'':'disabled')}${button('clear-records','모든 시연 기록 삭제','secondary danger',records.length?'':'disabled')}\u003c/div>\u003ch3>기록 기준과 메뉴 안내\u003c/h3>\u003cp>선택 변경은 이미 값이 있는 장소·구성·사이드·음료를 다른 값으로 고르거나, 수량을 1개씩 바꾸거나, 담은 메뉴를 삭제할 때마다 1회 기록합니다. 기본 구성에서 다른 항목으로 바꾸는 것도 포함하며, 저장하지 않은 수정도 포함합니다. 처음 고르는 선택과 이전 화면 이동은 변경으로 세지 않습니다.\u003c/p>\u003cp style=\"margin-top:14px\">선택 변경은 오류를 의미하지 않습니다. 오류는 관찰자가 따로 입력합니다. 소리 요청 횟수는 이용자가 듣기·다시 듣기·소리 켜기를 누른 횟수이며, 자동 안내는 제외합니다. 주문 시작 전의 소리 요청은 시도에 포함하지 않습니다.\u003c/p>\u003cp style=\"margin-top:14px\">과제 일치는 장소와 최종 메뉴 1가지, 단품·세트, 사이드, 음료, 수량을 모두 확인합니다. 관련 없는 메뉴가 추가되면 일치로 처리하지 않습니다.\u003c/p>\u003cp class=\"admin-note\">가상 매장의 메뉴·가격·변경 조건은 시연용 자료입니다. 실제 매장이나 업체와 연결되지 않습니다.\u003cbr>세트 추가 ${won(SET_EXTRA)} · 양념감자 변경 +600원 · 치즈스틱 변경 +800원 · 오렌지주스 변경 +500원\u003c/p>${storageAvailable?'\u003cp class=\"admin-note\">기록은 이 브라우저에 저장됩니다. 다른 기기나 브라우저와 공유되지 않습니다.\u003c/p>':'\u003cp class=\"admin-note warning\" role=\"status\">브라우저 저장을 사용할 수 없어 현재 페이지의 메모리에만 기록합니다. 새로고침하거나 파일을 닫기 전에 CSV를 내려받아 주세요.\u003c/p>'}`;\n}\nfunction openAdmin(){adminError='';openDialog('admin','시연 관리자',adminContent(),true);}\nfunction saveAdmin() {\n  const participant=state.active?state.active.participant:$('participant-input').value.trim().toUpperCase();\n  if(!/^P\\d{2,4}$/.test(participant)){adminError='참여자 코드는 P01처럼 P와 숫자 2~4자리로 입력해 주세요.';openDialog('admin','시연 관리자',adminContent(),true);return;}\n  settings={...settings,participant:state.active?settings.participant:participant,task:state.active?settings.task:$('task-input').value,mode:$('mode-input').value,paymentError:$('payment-error-input').checked};persist();adminError='';openDialog('admin','시연 관리자',adminContent(),true);toast('다음 주문에 사용할 설정을 저장했어요.');\n}\nfunction validErrors(value){return /^\\d{1,3}$/.test(String(value)) && Number(value)\u003c=999;}\n// UTF-8 BOM을 넣어 한국어를 보존하고, 쉼표와 따옴표도 CSV 규칙대로 처리합니다.\nfunction exportCSV() {\n  const headers=['참여자 코드','과제','과제 문장','주문 방식','시작 시각','종료 시각','소요 시간(초)','진행 결과','지정 과제 일치','도움 창 횟수','소리 요청 횟수','선택 변경 횟수','관찰 오류 횟수','먹을 장소','최종 주문','합계(원)'];\n  const rows=records.map(r=>[r.participant,r.task,TASKS[r.task],modeName(r.mode),dateText(r.startMs),dateText(r.endMs),(r.durationMs/1000).toFixed(2),r.status==='completed'?'완료':'중도 종료',r.status==='completed'?(r.matched?'일치':'불일치'):'완료하지 않음',r.helpCount,r.audioRequests,r.changes,r.observerErrors,placeName(r.place),summary(r.cart),r.total]);\n  const cell=value=>'\"'+String(value??'').replace(/^[=+@-]/,\"'$&\").replace(/\"/g,'\"\"')+'\"';\n  const csv='\\uFEFF'+[headers,...rows].map(row=>row.map(cell).join(',')).join('\\r\\n');\n  const link=document.createElement('a'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'}));link.href=url;link.download=`온디-시연기록-${new Date().toLocaleDateString('sv-SE')}.csv`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('시연 기록 CSV를 내려받았어요.');\n}\n\n// 8. 버튼 동작은 한 곳에서 처리합니다. 빠른 중복 조작도 현재 화면을 확인합니다.\ndocument.addEventListener('click',event=>{\n  const b=event.target.closest('button[data-action]');if(!b || b.disabled)return;\n  const action=b.dataset.action,value=b.dataset.value,id=b.dataset.id;\n  switch(action){\n    case 'start':if(state.screen==='home')startTrial();break;\n    case 'new':if(state.screen==='done'){state.cart=[];state.history=[];navigate('home',false);}break;\n    case 'font':state.large=!state.large;render();toast(state.large?'글씨를 크게 바꿨어요. 다시 누르면 원래 크기로 돌아가요.':'원래 글씨 크기로 바꿨어요.');break;\n    case 'speak':state.voice=speak(guideText());render();break;\n    case 'voice':if(state.voice){state.voice=false;stopSpeech();render();toast('소리 안내를 껐어요.');}else{state.voice=speak(guideText());render();if(state.voice)toast('소리 안내를 켰어요.');}break;\n    case 'help':openHelp();break;\n    case 'help-speak':state.voice=speak(guideText());render();break;\n    case 'help-mute':state.voice=false;stopSpeech();render();toast('소리 안내를 껐어요.');break;\n    case 'highlight':closeDialog();state.highlight=true;render();if(!$('main').querySelector('[data-next=true]:not(:disabled)'))$('main').querySelector('.choice:not(:disabled)')?.focus();toast('테두리가 강조된 버튼을 눌러 주세요. 선택 버튼도 키보드로 고를 수 있어요.');break;\n    case 'staff':supportConsent();break;\n    case 'unused-staff':state.staff=true;openDialog('help','직원 도움 요청 시연','\u003cp>시연: 직원에게 도움을 요청한 상태예요.\u003c/p>\u003cp>실제로 직원에게 연락되거나 연결되지는 않습니다. 도움 창을 닫으면 주문을 이어갈 수 있어요.\u003c/p>'+button('close','도움 창 닫고 이어하기','primary'));break;\n    case 'admin':openAdmin();break;\n    case 'close':closeDialog();break;\n    case 'back':back();break;\n    case 'reset':requestReset();break;\n    case 'confirm-reset':if(state.active){closeDialog();finishTrial('aborted');state.cart=[];state.history=[];state.draft=null;state.editId=null;state.editField=null;state.placeReturn=null;navigate('home',false);}break;\n    case 'place':countChange(state.place,value);state.place=value;render();break;\n    case 'place-next':if(!state.place)break;if(state.placeReturn){const dest=state.placeReturn;state.placeReturn=null;navigate(dest,false);toast('먹을 장소를 바꿨어요. 메뉴와 수량은 그대로예요.');}else navigate(state.active.mode==='guided'?'find':'list');break;\n    case 'group':state.group=value;navigate('list');break;\n    case 'other-group':navigate('find');break;\n    case 'tab':state.tab=value;render();break;\n    case 'menu':chooseMenu(value);break;\n    case 'type':setDraft('type',value);render();break;\n    case 'type-next':if(state.draft.type)navigate(state.draft.type==='set'?'side':'qty');break;\n    case 'side':setDraft('sideId',value);render();break;\n    case 'side-next':navigate('drink');break;\n    case 'drink':setDraft('drinkId',value);render();break;\n    case 'drink-next':navigate('qty');break;\n    case 'minus':case 'plus':{const quantity=state.draft.qty+(action==='plus'?1:-1);if(quantity>=1&&quantity\u003c=9){setDraft('qty',quantity);render();$('live').textContent=`수량 ${quantity}개, 합계 ${won(itemTotal(state.draft))}`;}break;}\n    case 'save':if(['qty','config','compact','type','side','drink'].includes(state.screen))saveDraft();break;\n    case 'more':state.draft=null;state.editId=null;state.editField=null;state.history=['cart'];navigate(state.active.mode==='guided'?'find':'list',false);break;\n    case 'edit':editDialog(id);break;\n    case 'edit-field':beginEdit(id,value);break;\n    case 'delete':pending=id;confirmDialog(id,'이 메뉴를 삭제할까요?',`${esc(getMenu(state.cart.find(i=>i.id===id).menuId).name)}만 삭제해요. 다른 메뉴는 그대로 남아요.`,'confirm-delete','이 메뉴 삭제하기');break;\n    case 'confirm-delete':{const index=state.cart.findIndex(i=>i.id===pending);if(index>=0){state.deleted={item:{...state.cart[index]},index};state.cart.splice(index,1);if(state.active)state.active.changes++;}closeDialog();render();toast('이 메뉴를 삭제했어요. 다른 메뉴는 그대로예요.');break;}\n    case 'edit-place':state.placeReturn=state.screen;state.history=[];navigate('place',false);break;\n    case 'to-review-back':if(state.cart.length)navigate('review');break;\n    case 'to-review':if(state.cart.length)navigate('review');break;\n    case 'to-cart':navigate('cart');break;\n    case 'to-pay':if(state.cart.lengt mpts=[\n      ['카드 넣는 곳을 찾아요.','실제 매장에서는 화면의 안내를 읽고 카드 투입구를 확인해요. 이 화면에서는 아래 연습 버튼을 눌러 보세요.','연습 카드 넣기'],\n      ['처리 결과를 읽어요.','교육용 화면: 모의 처리가 끝났어요. 실제로는 완료 또는 오류 안내가 나올 때까지 기다린 뒤 내용을 확인해요.','처리 안내를 확인했어요'],\n      ['카드를 챙겨요.','카드를 빼라는 안내를 확인한 뒤 투입구의 카드를 챙겨요. 아래 버튼으로 동작을 연습해 보세요.','연습 카드 빼기'],\n      ['영수증과 안내번호를 확인해요.','실제 매장에서는 영수증과 주문번호를 챙기고, 화면에서 음식을 받는 곳도 확인해요.','영수증과 안내번호를 확인했어요']\n    ];\n    const step=practice.step,info=prompts[step];\n    content=`\u003col class=\"card-practice-steps\" aria-label=\"카드 사용 연습 순서\">${labels.map((label,n)=>`\u003cli ${n===step?'aria-current=\"step\"':''}>\u003cspan aria-hidden=\"true\">${n+1}\u003c/span>${label}${n\u003cstep?'\u003csmall>연습함\u003c/small>':''}${n===step?'\u003csmall>현재\u003c/small>':''}\u003c/li>`).join('')}\u003c/ol>\u003cdiv id=\"card-practice-status\" class=\"card-practice-status\" role=\"status\" aria-live=\"polite\" aria-atomic=\"true\">${info?`\u003ch3>${step+1}. ${info[0]}\u003c/h3>\u003cp>${info[1]}\u003c/p>${step===3?`\u003cdiv class=\"sample-receipt\">\u003cstrong>교육용 예시 · 영수증\u003c/strong>\u003cp>담은 메뉴 합계 ${won(cartTotal())}\u003c/p>\u003cp>연습 안내번호 \u003cstrong>예시 001\u003c/strong>\u003c/p>\u003csmall>이번 주문의 번호는 연습 완료 뒤 별도로 표시돼요.\u003c/small>\u003c/div>`:''}`:'\u003ch3>카드 사용 순서 4가지를 익혔어요.\u003c/h3>\u003cp>이 연습으로 결제가 실행되지는 않았어요. 아래 ‘모의 결제 완료’를 누르면 이번 주문 연습이 끝나요.\u003c/p>'}\u003c/div>\u003cdiv class=\"card-practice-actions\">${info?button('card-practice-next',info[2],'secondary',`id=\"card-practice-next\" data-step=\"${step}\"`):button('card-practice-reset','카드 순서 다시 연습','secondary','id=\"card-practice-reset\"')}\u003c/div>`;\n  }\n  return `\u003csection class=\"card-practice\" aria-labelledby=\"card-practice-title\">\u003cdiv class=\"card-practice-head\">\u003cdiv>\u003cp class=\"step-label\">원하면 더 연습해요\u003c/p>\u003ch2 id=\"card-practice-title\">카드 결제 순서 연습\u003c/h2>\u003cp>카드와 영수증을 챙기는 순서를 버튼으로 익혀요.\u003c/p>\u003c/div>${button('card-practice-toggle',practice.open?'카드 연습 접기':'카드 순서 연습하기','secondary',`id=\"card-practice-toggle\" aria-expanded=\"${practice.open}\" aria-controls=\"card-practice-content\"`)}\u003c/div>\u003cp class=\"card-practice-note\">실물 카드나 카드번호가 필요 없어요. 이 카드 사용 연습은 건너뛰어도 주문 연습을 마칠 수 있어요.\u003c/p>\u003cdiv id=\"card-practice-content\" ${practice.open?'':'hidden'}>${content}\u003c/div>\u003c/section>`;\n}\nfunction render(resetFocus=false){\n  document.body.dataset.foodScreen=state.screen;\n  if(state.helpOpen&&state.helpScreen!==state.screen)state.helpOpen=false;\n  if(state.screen==='home'&&previousScreen!=='home')homeShownAt=Date.now();previousScreen=state.screen;\n  const focused=document.activeElement?.id,scroll=window.scrollY;\n  if(state.draft?.type!=='set'&&['SIDE','DRINK'].includes(state.expanded))state.expanded=null;\n  syncMenu();\n  const menu=getMenu('bulgogi'),side=getMenu('potato'),cola=getMenu('cola'),zero=getMenu('zero');\n  TASKS.A=`${currentStore().labels.store}에서 먹을 ${menu.name} 세트 1개를 주문하세요. 함께 먹을 음식은 ${side.name}, 음료는 ${cola.name}로 선택하고 모의 결제를 완료하세요.`;\n  TASKS.B=`${currentStore().labels.store}에서 먹을 ${menu.name} 세트를 주문하세요. 함께 먹을 음식은 ${side.name}, 음료는 ${zero.name}로 바꾸고 수량을 2개로 선택한 뒤 모의 결제를 완료하세요.`;\n  syncMenu();document.body.classList.toggle('store-b',(state.active?.store||settings.store)==='B');document.body.classList.toggle('high-contrast',!!settings.highContrast);\n  if(state.screen==='compact'){\n    document.body.classList.toggle('large',state.large);document.body.classList.toggle('screen-home',false);document.body.classList.toggle('has-checkout',true);renderHeader();$('main').innerHTML=compactScreen();\n    syncCheckoutSpace();checkoutObserver?.disconnect();const dock=$('main').querySelector('.checkout-dock');if(dock)checkoutObserver?.observe(dock);if(resetFocus){window.scrollTo(0,0);$('page-title')?.focus({preventScroll:true});}else{if(focused)document.getElementById(focused)?.focus({preventScroll:true});window.scrollTo(0,scroll);}\n  }else renderBase(resetFocus);\n  if(state.active)$('main').insertAdjacentHTML('afterbegin',orderPath());\n  if(state.screen==='pay'){\n    const payCard=$('main').querySelector('.pay-card');\n    payCard?.insertAdjacentHTML('beforeend',cardPractice());\n  }\n  if(state.screen==='done')$('main').insertAdjacentHTML('afterbegin',`\u003csection class=\"order-number\">\u003cspan>연습용 주문번호\u003c/span>\u003cstrong>${esc(state.orderNumber||'—')}\u003c/strong>\u003cp>실제 수령은 진행되지 않아요. 실제 매장에서는 화면의 수령 안내를 확인해 주세요.\u003c/p>\u003c/section>`);\n  if(state.active){$('main').insertAdjacentHTML('beforeend',assistanceBar());if(state.screen==='compact')$('main').insertAdjacentHTML('beforeend',button('reset','주문 취소하고 처음으로','text-button'));}\n  if(state.deleted&&['cart','review'].includes(state.screen))$('main').insertAdjacentHTML('afterbegin',`\u003cdiv class=\"undo-panel\" role=\"status\">\u003cspan>${esc(getMenu(state.deleted.item.menuId).name)}를 삭제했어요.\u003c/span>${button('restore-delete','삭제한 메뉴 되돌리기','secondary')}\u003c/div>`);\n  const footer=document.querySelector?.('.footer>span');if(footer)footer.textContent=currentStore().name+' · 연습 화면 · 시연용 가격 · 실제 주문은 전송되지 않아요.';\n  if(state.helpOpen){refreshObservation();$('main').insertAdjacentHTML('beforeend',detailedHelpContent());}\n  refreshObservation();\n  // 같은 화면의 다시 그리기에서도 학습 버튼의 초점과 스크롤을 보존합니다.\n  if(!resetFocus&&focused?.startsWith('card-practice-')){const target=document.getElementById(focused)||document.getElementById('card-practice-reset')||document.getElementById('card-practice-toggle');target?.focus({preventScroll:true});window.scrollTo(0,scroll);}\n  clearTimeout(idleTimer);\n  if(state.active&&!hintShown)idleTimer=setTimeout(()=>{hintShown=true;const region=$('support-status');if(region&&!supportText)region.textContent='설명이 더 필요하면 ‘자세히 안내’를 눌러 주세요.';},20000);\n}\nfunction openDialog(kind,title,content,admin=false){if(state.helpOpen){state.helpOpen=false;render();}openDialogBase(kind,title,content,admin);refreshObservation();}\nfunction closeDialog(){if(!$('dialog').open&&state.helpOpen){closeDetailedHelp();return;}closeDialogBase();refreshObservation();}\nfunction helpSelection(){\n  const d=state.draft;\n  if(['compact','config','type','side','drink','qty'].includes(state.screen)&&d){\n    const configuration=d.type?components(d):'단품·세트 선택 전';\n    return getMenu(d.menuId).name+' · '+configuration+' · '+d.qty+'개'+(d.type?' · 이 메뉴의 합계 '+won(itemTotal(d)):'');\n  }\n  if(['cart','review','pay','done'].includes(state.screen))return state.cart.length?placeName(state.place)+' · '+summary(state.cart)+' · 전체 합계 '+won(cartTotal()):'아직 담은 메뉴가 없어요.';\n  return state.place?'먹을 장소: '+placeName(state.place):'아직 먹을 장소를 고르지 않았어요.';\n}\nfunction detailedHelpContent(){\n  const guide=HangeolCommon.guidance(screenObserver.current,true),help=guide.help;\n  return `\u003csection id=\"detail-guide-panel\" class=\"detail-guide-panel\" data-guidance-panel tabindex=\"-1\" aria-labelledby=\"detail-guide-title\">\u003cp class=\"step-label\">지금 화면을 자세히 알아보기\u003c/p>\u003ch2 id=\"detail-guide-title\">${esc(help.title)}\u003c/h2>\u003cdiv class=\"help-selection\">\u003ch3>지금 선택한 내용\u003c/h3>\u003cp>${esc(helpSelection())}\u003c/p>\u003c/div>\u003ch3>이 순서로 해 보세요\u003c/h3>\u003col class=\"help-steps\">${help.steps.map(step=>`\u003cli>${esc(step)}\u003c/li>`).join('')}\u003c/ol>\u003cp class=\"help-note\">${esc(help.note)}\u003c/p>\u003cdiv class=\"dialog-buttons\">${button('close-detail','설명 접고 주문 계속하기','primary')}${button('read-detail','방법을 소리로 듣기','secondary')}${button('support-consent','함께 안내받기','secondary')}\u003c/div>\u003c/section>`;\n}\nfunction openHelp(){\n  if($('dialog').open)return;\n  if(!state.helpOpen&&state.active)state.active.helpCount++;\n  stopSpeech();state.helpReturnFocus=document.activeElement?.id;state.helpOpen=true;state.helpScreen=state.screen;render();\n  const panel=$('detail-guide-panel');panel?.focus({preventScroll:true});panel?.scrollIntoView?.({block:'start'});\n}\nfunction closeDetailedHelp(){\n  stopSpeech();state.helpOpen=false;render();\n  if(state.helpReturnFocus)document.getElementById(state.helpReturnFocus)?.focus({preventScroll:true});\n}\n\nfunction supportConsent(){\n  openDialog('support','함께 안내받을까요?',`\u003cp>연결하면 안내원이 이 연습 화면의 메뉴와 선택 상태를 함께 봅니다. 촬영 안내에서는 확인된 연습 화면만 공유합니다.\u003c/p>\u003cp>안내원이 입력한 설명을 여기서 글과 소리로 받아요. 음성통화나 원격 클릭 기능은 아닙니다.\u003c/p>\u003cdiv class=\"dialog-buttons\">${button('support-request','이 화면을 공유하고 연결 요청','primary')}${button('close','혼자 계속하기','secondary')}\u003c/div>${['REQUESTED','CONNECTING','CONNECTED','DISCONNECTED'].includes(serverClient.status)?button('support-cancel','안내 요청 취소하기','secondary'):''}`);\n}\nfunction adminContent(){\n  const locked=state.active?'disabled':'';\n  const rated=state.active||records.find(r=>r.id===state.lastRecord)||records.at(-1);\n  const ratings=rated?`\u003ch3>직접 관찰·측정한 결과만 입력\u003c/h3>\u003cdiv class=\"admin-form\">\u003clabel>소리 이해도 (1: 어려움, 5: 쉬움)\u003cselect id=\"rating-understanding\">\u003coption value=\"\">미측정\u003c/option>${[1,2,3,4,5].map(n=>`\u003coption value=\"${n}\" ${rated.voiceUnderstanding===n?'selected':''}>${n}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003clabel>도움 요청 부담감 (1: 낮음, 5: 높음)\u003cselect id=\"rating-burden\">\u003coption value=\"\">미측정\u003c/option>${[1,2,3,4,5].map(n=>`\u003coption value=\"${n}\" ${rated.helpBurden===n?'selected':''}>${n}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003clabel>준비 시간 (초, 직접 측정)\u003cinput id=\"rating-preparation\" type=\"number\" min=\"0\" max=\"3600\" step=\"0.1\" value=\"${rated.preparationTimeMs==null?'':rated.preparationTimeMs/1000}\">\u003c/label>\u003clabel>시스템 대기 (초, 직접 측정)\u003cinput id=\"rating-wait\" type=\"number\" min=\"0\" max=\"3600\" step=\"0.1\" value=\"${rated.systemWaitMs==null?'':rated.systemWaitMs/1000}\">\u003c/label>${button('save-ratings','이 시도의 관찰 결과 저장','secondary')}\u003c/div>\u003cp class=\"admin-note\">현재 진행 중인 시도, 없으면 최근 시도에 저장합니다. 생각한 시간과 시스템 대기를 구분하세요. 자동으로 측정하지 않은 값은 비워 둡니다. 방식별 비교에는 매장과 이전 버전이 섞여 있을 수 있어 음성 효과를 입증하는 값으로 사용하지 않습니다.\u003c/p>`:'';\n  const bstatus=browserSpeech.getStatus();\n  return adminContentBase()+ratings+`\u003ch3>매장과 안내 설정\u003c/h3>\u003cdiv class=\"admin-form\">\u003clabel>다음 연습 매장\u003cselect id=\"upgrade-store\" ${locked}>\u003coption value=\"A\" ${settings.store==='A'?'selected':''}>가상 매장 A\u003c/option>\u003coption value=\"B\" ${settings.store==='B'?'selected':''}>가상 매장 B\u003c/option>\u003c/select>\u003c/label>\u003clabel>구성 화면\u003cselect id=\"upgrade-compact\" ${locked}>\u003coption value=\"yes\" ${settings.compact?'selected':''}>한 화면에서 필요한 항목만 펼치기\u003c/option>\u003coption value=\"no\" ${!settings.compact?'selected':''}>기존 단계별 화면 유지\u003c/option>\u003c/select>\u003c/label>\u003clabel>소리 안내 제공\u003cselect id=\"upgrade-provider\">\u003coption value=\"browser\" ${settings.speechProvider==='browser'?'selected':''}>이 기기의 한국어 소리\u003c/option>\u003coption value=\"naver\" ${settings.speechProvider==='naver'?'selected':''}>연결한 외부 소리\u003c/option>\u003c/select>\u003c/label>\u003clabel>기기의 한국어 목소리\u003cselect id=\"upgrade-voice\">\u003coption value=\"\">기본 목소리\u003c/option>${bstatus.voices.map(v=>`\u003coption value=\"${esc(v.name)}\" ${settings.voiceName===v.name?'selected':''}>${esc(v.name)}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003clabel>기기 소리 속도\u003cselect id=\"upgrade-rate\">${[.8,.9,1].map(v=>`\u003coption value=\"${v}\" ${Number(settings.rate)===v?'selected':''}>${v}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003clabel>음량\u003cselect id=\"upgrade-volume\">${[.3,.5,.7,1].map(v=>`\u003coption value=\"${v}\" ${Number(settings.volume)===v?'selected':''}>${v}\u003c/option>`).join('')}\u003c/select>\u003c/label>\u003clabel class=\"check\">\u003cinput id=\"upgrade-auto\" type=\"checkbox\" ${settings.enableVoice?'checked':''}>주문 시작 시 소리 안내 켜기\u003c/label>\u003clabel class=\"check\">\u003cinput id=\"upgrade-contrast\" type=\"checkbox\" ${settings.highContrast?'checked':''}>고대비로 보기\u003c/label>\u003clabel class=\"check\">\u003cinput id=\"upgrade-fallback\" type=\"checkbox\" ${settings.allowBrowserFallback?'checked':''}>외부 소리가 안 되면 기기 소리 사용 허용\u003c/label>${button('upgrade-save','매장·안내 설정 저장','primary')}\u003c/div>\u003ch3>발표자용 연결 진단\u003c/h3>\u003cp class=\"admin-note\">기기 한국어 목소리: ${bstatus.available?'사용 가능':'없음 또는 준비되지 않음'}\u003cbr>확장 서버: ${serverClient.available?'응답 확인':'연결되지 않음'}\u003cbr>외부 소리 설정: ${serverClient.health?.tts.available?'키 설정됨 · 실제 재생 미검증':'키 설정 안 됨'}\u003cbr>화면 읽기: ${esc(serverClient.health?.camera.status||'서버 연결 필요')} · 실제 카메라 검증 전\u003cbr>안내원 연결: ${esc(serverClient.status)} · 실제 두 기기 검증 전\u003c/p>\u003cp>등록 모듈: 음식 주문 사용 가능 · 금융 연습과 천지인 연습은 통합 홈에서 이용할 수 있습니다.\u003c/p>`;\n}\ndocument.addEventListener('click',async event=>{\n  const b=event.target.closest('button[data-action]');if(!b||b.disabled)return;\n  const action=b.dataset.action;\n  if(action==='card-practice-toggle'&&state.screen==='pay'&&state.active){state.cardPractice||={open:false,step:0};state.cardPractice.open=!state.cardPractice.open;render();}\n  if(action==='card-practice-next'&&state.screen==='pay'&&state.active&&state.cardPractice?.open&&Number(b.dataset.step)===state.cardPractice.step&&state.cardPractice.step\u003c4){state.cardPractice.step++;render();}\n  if(action==='card-practice-reset'&&state.screen==='pay'&&state.active){state.cardPractice={open:true,step:0};render();}\n  if(action==='expand-option'){state.expanded=state.expanded===b.dataset.value?null:b.dataset.value;render();}\n  if(action==='collapse-option'){const field=state.expanded;state.expanded=null;render();document.getElementById('expand-'+field)?.focus({preventScroll:true});}\n  if(['voice','help-mute'].includes(action)&&state.active)state.active.voiceCondition='mixed';\n  if(action==='repeat-guide')speak(guideText(),true);\n  if(action==='read-detail')speak(HangeolCommon.guidance(screenObserver.current,true).spoken_text,true,{detailed:true});\n  if(action==='close-detail')closeDetailedHelp();\n  if(action==='detailed-guide'){if(state.helpOpen)closeDetailedHelp();else openHelp();}\n  if(action==='support-consent')supportConsent();\n  if(action==='support-request'){try{closeDialog();refreshObservation(true);await serverClient.supportRequest();supportText='안내원이 요청을 확인하면 함께 볼 수 있어요. 주문은 계속할 수 있어요.';updateSupportRegion();}catch(error){openDialog('support','기본 안내로 계속할 수 있어요.',`\u003cp>${esc(error.message)}\u003c/p>${button('close','주문으로 돌아가기','primary')}`);}}\n  if(action==='support-cancel'){await serverClient.cancelSupport().catch(()=>{});supportText='안내 요청을 취소했어요. 주문은 그대로예요.';closeDialog();render();}\n  if(action==='restore-delete'&&state.deleted){const {item,index}=state.deleted;const same=state.cart.filter(i=>i.menuId===item.menuId&&i.type===item.type&&i.sideId===item.sideId&&i.drinkId===item.drinkId);if(same.reduce((n,i)=>n+i.qty,0)+item.qty>9){toast('같은 구성의 수량이 9개를 넘어요. 현재 주문은 그대로예요.');return;}state.cart.splice(Math.min(index,state.cart.length),0,item);state.deleted=null;if(state.active)state.active.changes++;render();toast('삭제한 메뉴를 되돌렸어요.');}\n  if(action==='payment-method'){countChange(state.paymentMethod,b.dataset.value);state.paymentMethod=b.dataset.value;render();}\n  if(action==='save-ratings'){const rated=state.active||records.find(r=>r.id===state.lastRecord)||records.at(-1);if(rated){const understanding=$('rating-understanding').value,burden=$('rating-burden').value,prep=$('rating-preparation').value,wait=$('rating-wait').value;const validScore=v=>v===''||/^[1-5]$/.test(v);const validTime=v=>v===''||Number.isFinite(Number(v))&&Number(v)>=0&&Number(v)\u003c=3600;if(!validScore(understanding)||!validScore(burden)||!validTime(prep)||!validTime(wait)){toast('관찰 값의 범위를 확인해 주세요.');return;}rated.voiceUnderstanding=understanding===''?null:Number(understanding);rated.helpBurden=burden===''?null:Number(burden);rated.preparationTimeMs=prep===''?null:Number(prep)*1000;rated.systemWaitMs=wait===''?null:Number(wait)*1000;persist();toast('직접 관찰한 결과를 저장했어요.');}}\n  if(action==='upgrade-save'){\n    if(!state.active)settings.store=$('upgrade-store').value;\n    if(!state.active)settings.compact=$('upgrade-compact').value==='yes';settings.speechProvider=$('upgrade-provider').value;settings.voiceName=$('upgrade-voice').value;settings.rate=Number($('upgrade-rate').value);settings.volume=Number($('upgrade-volume').value);settings.enableVoice=$('upgrade-auto').checked;settings.highContrast=$('upgrade-contrast').checked;settings.allowBrowserFallback=$('upgrade-fallback').checked;persist();setSpeechSettings();closeDialog();render();toast('매장과 안내 설정을 저장했어요.');\n  }\n});\ndocument.addEventListener('toggle',event=>{if(event.target.id==='order-path-details')state.orderPathOpen=event.target.open;},true);\ndocument.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.helpOpen&&!$('dialog').open){event.preventDefault();closeDetailedHelp();}});\nloadStorage();settings.store=HangeolConfig.stores[settings.store]?settings.store:'A';syncMenu();setSpeechSettings();\nif(typeof location!=='undefined'){const params=new URLSearchParams(location.search);if(!state.active&&['A','B'].includes(params.get('store')))settings.store=params.get('store');if(['on','off'].includes(params.get('voice')))settings.enableVoice=params.get('voice')==='on';}\nrender();serverClient.init();\n\n// CSV에는 측정하지 않은 값을 빈칸으로 남깁니다. 음성·영상은 내보내지 않습니다.\nfunction exportCSV(){\n  const headers=['참여자 코드','과제','과제 문장','매장','주문 방식','구성 화면','초기 소리 조건','시작 시각','종료 시각','소요 시간(초)','결과','과제 일치','도움 창','소리 요청','선택 변경','관찰 오류','먹을 장소','최종 주문','합계(원)','연습 주문번호','사람 도움 후 완료','첫 행동까지(초)','준비 시간(초)','시스템 대기(초)','소리 이해도','도움 부담감'];\n  const rows=records.map(r=>[r.participant,r.task,r.taskText||TASKS[r.task],r.store||'A',modeName(r.mode),r.version==='2'?(r.compact?'한 화면':'단계별'):'이전 버전',r.voiceCondition||'미기록',dateText(r.startMs),dateText(r.endMs),(r.durationMs/1000).toFixed(2),r.status==='completed'?'완료':'중도 종료',r.status==='completed'?(r.matched?'일치':'불일치'):'완료하지 않음',r.helpCount,r.audioRequests,r.changes,r.observerErrors,HangeolConfig.stores[r.store||'A'] ;\n   const buttons=[...$('dialog').querySelectorAll('[data-action=\"edit-field\"]')];if(!buttons.length)return null;\n   const item=cart.find(i=>i.id===buttons[0].dataset.id),field=issue(item,g);return field?cue('edit-field','바꿀 항목만 표시했어요. 다른 메뉴는 유지돼요.',field,{id:item.id}):null;\n  }\n  if(state.screen==='home')return cue('start','표시한 ‘주문 시작’을 눌러 하나씩 연습해요.');\n  if(state.screen==='place')return state.place===g.place?cue('place-next','먹을 장소를 골랐어요. 표시한 선택 완료 버튼을 눌러요.'):cue('place','이번에는 ‘'+placeName(g.place)+'’를 눌러요.',g.place);\n  if(state.screen==='find')return cue('group','‘'+(menu.category==='burger'?'불고기·데리버거':'사이드만 주문하기')+'’를 눌러 메뉴를 찾아요.',menu.category==='burger'?'beef':'side');\n  if(state.screen==='list'){\n   if(!$('main').querySelector('[data-action=\"menu\"][data-value=\"'+wanted+'\"]'))return cue(state.active?.mode==='normal'?'tab':'other-group','목표 메뉴가 다른 종류에 있어요. 표시한 버튼으로 종류를 바꿔요.',state.active?.mode==='normal'?menu.category:undefined);\n   return cue('menu','‘'+menu.name+'’를 눌러요. 이름과 사진을 함께 확인해요.',wanted);\n  }\n  if(['compact','config','type','side','drink','qty'].includes(state.screen)&&d){\n   const wantedQty=d.menuId==='bulgogi'?g.qty:1,field=issue(d,g),row={side:'SIDE',drink:'DRINK',qty:'QUANTITY'}[field],action={side:'side',drink:'drink'}[field],desired={side:'potato',drink:g.drink||'cola'}[field];\n   if(field==='type')return cue('type','버거와 함께 먹을 음식·음료가 있는 ‘세트’를 눌러요.','set');\n   if(state.screen==='compact'){\n    if(field&&state.expanded!==row)return cue('expand-option','‘'+({side:'함께 먹을 음식',drink:'음료',qty:'수량'}[field])+' 변경’을 눌러요.',row);\n    if(field==='qty')return cue(d.qty\u003cwantedQty?'plus':'minus','메뉴 수량을 '+wantedQty+'개로 맞춰요. 표시한 버튼은 1개씩 바꿔요.');\n    if(action)return cue(action,'목표의 ‘'+getMenu(desired).name+'’를 눌러요.',desired);\n    if(state.expanded)return cue('collapse-option','바꾼 내용을 확인하고 표시한 변경 완료 버튼을 눌러요.');\n    return cue('save','구성과 수량을 확인했어요. 표시한 버튼으로 주문에 담아요.');\n   }\n   if(state.screen==='qty'&&field==='qty')return cue(d.qty var HangeolSpeech = (() => {

})();

/* 가상 장부만 변경합니다. 실제 계좌/API와 연결하지 않습니다. */
var OndiBank=(()=>{
 const clone=x=>JSON.parse(JSON.stringify(x));

 function journey(view){
  const scenario=view.scenario||{},source=view.steps||scenario.steps||[],phase=String(view.phase||'FORM');
  const formSteps=source.filter(step=>!['REVIEW','VERIFY','PAYMENT','COLLECT','RESULT'].includes(step.phase));
  const steps=formSteps.map((step,index)=>({id:step.id,title:step.title||step.label,index,phase:'FORM'}));
  steps.push({id:'review',title:'선택 내용 확인',phase:'REVIEW'});
  if(scenario.flow?.verification)steps.push({id:'verify',title:'모의 본인 확인',phase:'VERIFY'});
  if(scenario.flow?.payment)steps.push({id:'payment',title:'모의 결제',phase:'PAYMENT'});
  steps.push({id:'collect',title:'받을 것 확인',phase:'COLLECT'});
  let current=phase==='FORM'?Math.max(0,Number(view.stepIndex||0)):steps.findIndex(step=>step.phase===phase);
  if(phase==='RESULT'||view.complete)current=steps.length;
  if(phase==='ERROR')current=Math.max(0,steps.findIndex(step=>step.phase==='PAYMENT'));
  return '<nav class="sk-journey" aria-label="위에서 아래로 진행하는 이용 순서"><p class="sk-section-label">이용 순서</p><ol>'+steps.map((step,index)=>'<li class="'+(index<current?'is-done':index===current?'is-current':'')+'"'+(index===current?' aria-current="step"':'')+'><span class="sk-journey-number" aria-hidden="true">'+(index<current?icon('check'):index+1)+'</span><span>'+esc(step.title)+'</span></li>').join('')+'</ol></nav>';
 }

 function exportCSV(){const header=['모듈','목표','방식','결과','활동_ms','중지_ms','자동대기_ms','행동','힌트','자세한설명','다시듣기','수정','준비_ms','이해도','부담감'];const rows=store.records.map(r=>[r.module_id,r.lesson_id,r.mode,r.result,r.activeMs,r.pausedMs,r.systemWaitMs,r.events?.actions,r.events?.hints,r.events?.details,r.events?.replays,r.events?.corrections,r.measures?.preparationMs,r.measures?.understanding,r.measures?.burden]);const encode=x=>'"'+String(x??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';const blob=new Blob(['\ufeff'+[header,...rows].map(row=>row.map(encode).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='온디-연습기록.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 async function pauseEntry(){reloadRevision++;stop();client.end();if(!current)return;clearTimeout(current.timer);if(current.model){if(current.model.phase==='BANK_PROCESSING')current.model=OndiBank.act(current.model,'pause');if(current.model.phase==='MSG_SENDING')current.model=OndiMessage.act(current.model,'pause');}else await pauseFrame();current.session.pause();}
 async function goHome(keep=true){await pauseEntry();if(!keep&&current){finish(current,'aborted');entries.delete(entryKey(current.lesson));if(isFood())await removeFrame();}route='home';render(true);}
 function requestLeave(){if(current.session.finished){goHome();return;}modal('진행 내용을 남기고 쉬어 갈까요?',`<p>진행 내용은 지금 열어 둔 창에 임시 저장돼요. 홈에서 ‘이어서 연습하기’로 돌아올 수 있어요.</p><p class="small muted">창을 닫거나 새로고침하면 진행 중인 입력은 지워져요.</p><div class="actions">${button('keep-home','임시 저장하고 처음으로','primary')}${button('end-home','연습 끝내고 처음으로','danger')}</div>`);}
 async function resume(id){const entry=entries.get(id);if(!entry||entry.session.finished)return;current=entry;moduleId=entry.lesson.module_id;scenarioId=entry.lesson.scenario_id||'fastfood';current.session.resume();details=false;hint=false;route='work';if(isFood()){render();if(!frame||frameEntry!==entry)createFrame();else sendFrame('resume');}else{client.init(entry.session);render(true);}}
 function sendFrame(type,extra={}){if(frame?.contentWindow)frame.contentWindow.postMessage({type:'ondi:'+type,lesson_id:frameEntry?.lesson.id,mode:frameEntry?.session.mode,preferences:{...prefs},...extra},location.protocol==='file:'||location.origin==='null'?'*':location.origin);}
 function createFrame(){
  const entry=current,node=document.createElement('iframe');frame=node;frameEntry=entry;frameReady=false;entry.frameFailed=false;entry.frameLoaded=false;entry.session.beginWait();clearTimeout(frameTimer);
  const boot={lesson_id:entry.lesson.id,mode:entry.session.mode,preferences:{...prefs},host_origin:location.origin,host_protocol:location.protocol};
  const fail=reason=>{if(frame!==node||frameReady)return;clearTimeout(frameTimer);entry.frameFailed=reason;entry.session.endWait();if(current===entry&&route==='work')renderKioskNav();};
  node.id='kiosk-frame';node.title='키오스크 주문 연습';node.setAttribute('allow','autoplay');node.dataset.ondiBootstrap=JSON.stringify(boot);
  node.addEventListener('load',()=>{if(frame!==node)return;entry.frameLoaded=true;if(route==='work'&&current===entry)sendFrame('resume');else sendFrame('pause');});
  node.addEventListener('error',()=>fail('load'));
  if(ONDI_STANDALONE){const encoded=JSON.stringify(boot).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');node.srcdoc=OndiKioskSource.replace('var OndiFrameBootstrap=null;',()=> 'var OndiFrameBootstrap='+encoded+';');}
  else node.src='/kiosk.html?lesson='+entry.lesson.id+'&mode='+entry.session.mode+'&embedded=1';
  $('kiosk-frame-slot').replaceChildren(node);renderKioskNav();
  frameTimer=setTimeout(()=>fail(entry.frameLoaded?'connection':'load'),5000);
 }
 function renderKioskNav(){const failed=current.frameFailed; $('kiosk-nav').innerHTML=`<div class="kiosk-toolbar">${button('leave','← 쉬었다 하기')}<p><strong>${lessonNumber(current.lesson)}단계 · ${esc(current.lesson.title)}</strong></p>${current.session.finished?button('show-summary','연습 결과 보기','primary'):''}</div>${missionBanner()}${!frameReady?`<div id="kiosk-ready-note" class="${failed?'error':'notice'}" role="status">${failed?(failed==='connection'?'주문 화면과 연결하지 못했어요.':'주문 화면을 불러오지 못했어요.')+' 아래 버튼으로 다시 시도해 주세요. 다시 불러오면 이번 주문 화면은 초기화돼요.':'주문 화면을 준비하고 있어요…'}${failed?button('reload-kiosk','화면 다시 불러오기'):''}</div>`:''}`;}
 function pauseFrame(){
  if(!frame)return Promise.resolve();if(framePausePromise)return framePausePromise;
  let resolvePause;const pending=new Promise(resolve=>{resolvePause=resolve;});framePausePromise=pending;
  const timer=setTimeout(()=>{pauseResolve?.();},800);
  pauseResolve=()=>{clearTimeout(timer);pauseResolve=null;framePausePromise=null;resolvePause();};sendFrame('pause');return pending;
 }
 async function removeFrame(){clearTimeout(frameTimer);await pauseFrame();if(frame){frame.src='about:blank';frame.remove();frame=null;}frameEntry=null;frameReady=false;}

 window.addEventListener('message',event=>{if(!frame||event.source!==frame.contentWindow||!(event.origin===location.origin||location.protocol==='file:'&&event.origin==='null'))return;const data=event.data;if(!data||typeof data.type!=='string')return;
  if(data.type==='ondi:paused'){pauseResolve?.();return;}
  if(data.type==='ondi:initialized'){if(!frameEntry||data.lesson_id!==frameEntry.lesson.id)return;frameReady=true;frameEntry.frameFailed=false;clearTimeout(frameTimer);frameEntry.session.endWait();if(current===frameEntry&&route==='work')renderKioskNav();return;}
  if(data.type==='ondi:ready'){if(current===frameEntry&&route==='work')sendFrame('resume');else sendFrame('pause');return;}
  if(data.type==='ondi:preferences'){if(!isFood()||current!==frameEntry||route!=='work')return;for(const k of ['voice','large','contrast'])if(typeof data.preferences?.[k]==='boolean')prefs[k]=data.preferences[k];store.save();document.body.classList.toggle('large',prefs.large);document.body.classList.toggle('contrast',prefs.contrast);renderHeader();return;}
  if(!isFood()||current!==frameEntry||current.session.finished||route!=='work')return;
  if(data.type==='ondi:kiosk-event'&&['actions','hints','details','replays','corrections'].includes(data.kind))current.session.event(data.kind);
  if(data.type==='ondi:kiosk-complete'){current.kioskChecks=OndiKioskFeedback.normalize(data.checks);current.orderNumber=typeof data.order_number==='string'&&/^[AB]\d{3,6}$/.test(data.order_number)?data.order_number:null;finish(current,data.status==='aborted'?'aborted':data.matched?(current.session.events.details+current.session.events.hints>0?'helped':'independent'):'different');renderKioskNav();if(data.status==='completed')showKioskCompletion();}
 });
 document.addEventListener('click',async event=>{const node=event.target.closest('[data-action]');if(!node||node.disabled)return;const action=node.dataset.action,value=node.dataset.value;
  if(action==='close'||action==='welcome-close'){closeModal();return;}
  if(action==='how-to'){showHowTo();return;}
  if(action==='view-mission'){showMission();return;}
  if(action==='read-completion'){readCompletion();return;}
  if(action==='completion-home'){closeModal();await goHome();return;}
  if(action==='completion-scenarios'){closeModal();await pauseEntry();moduleId='kiosk';route='scenarios';render(true);return;}
  if(action==='voice'){prefs.voice=!prefs.voice;savePreferences();if(prefs.voice&&route==='work'){if(dialogKind==='kiosk-complete')readCompletion();else read();}return;}
  if(action==='large'){prefs.large=!prefs.large;savePreferences();return;}
  if(action==='settings'){settings();return;}if(action==='progress'){progress();return;}
  if(action==='save-settings'){prefs.provider=$('pref-provider').value;prefs.rate=Number($('pref-rate').value);prefs.volume=Number($('pref-volume').value);prefs.contrast=$('pref-contrast').value==='true';savePreferences();closeModal();toast('설정을 저장했어요.');return;}
  if(action==='save-observation'){const rated=current&&!current.session.finished?current.session:store.records.at(-1);if(!rated)return;const understanding=$('observe-understanding').value,burden=$('observe-burden').value,prep=$('observe-preparation').value;if(![understanding,burden].every(v=>v===''||/^[1-5]$/.test(v))||!(prep===''||Number.isFinite(Number(prep))&&Number(prep)>=0&&Number(prep)<=3600)){toast('관찰값의 범위를 확인해 주세요.');return;}rated.measures={understanding:understanding===''?null:Number(understanding),burden:burden===''?null:Number(burden),preparationMs:prep===''?null:Number(prep)*1000};if(current?.session.id===rated.id)current.session.measures={...rated.measures};store.save();toast('직접 관찰한 값을 저장했어요.');return;}
  if(action==='save-simulation'){if(!current||current.session.finished||!['BANK_HOME','MSG_LIST'].includes(current.model?.phase))return;const mode=$('simulate-failure').value;current.model=current.lesson.module_id==='banking'?OndiBank.act(current.model,'failure',mode):OndiMessage.act(current.model,'failure',mode,P,D.contacts);closeModal();render();toast('모의 오류 시연을 설정했어요.');return;}
  if(action==='csv'){exportCSV();return;}if(action==='clear-records'){modal('완료 기록을 지울까요?',`<p>이 브라우저에 저장된 완료 요약을 모두 지워요. 지금 연습 중인 내용은 유지해요.</p><div class="actions">${button('delete-records','기록 지우기','danger')}${button('close','보관하기','primary')}</div>`);return;}if(action==='delete-records'){store.clear();closeModal();if(route==='home')render();toast('완료 기록을 지웠어요.');return;}
  if(action==='modal-replace'){const callback=modalAction;closeModal();await callback?.();return;}if(action==='modal-resume'){const id=entryKey(selected);closeModal();await resume(id);return;}
  if(action==='keep-home'||action==='end-home'){closeModal();await goHome(action==='keep-home');return;}
  if(action==='app-home'){if(route==='work'&&current){requestLeave();return;}closeModal();stop();route='home';render(true);return;}
  if(action==='home'){stop();route='home';render(true);return;}
  if(action==='module'){stop();moduleId=value;route=value==='kiosk'?'scenarios':'lessons';render(true);return;}
  if(action==='scenarios'){closeModal();moduleId='kiosk';route='scenarios';render(true);return;}
  if(action==='scenario-filter'){scenarioFilter=value;render();return;}
  if(action==='choose-scenario'){scenarioId=value;moduleId='kiosk';route='lessons';render(true);return;}
  if(action==='lessons'){route='lessons';render(true);return;}
  if(action==='lesson'||action==='next-lesson'){selectLesson(D.lessons.find(l=>l.id===value));return;}
  if(action==='begin'){showStartMission(value);return;}if(action==='start-mission'){const pending=pendingStart;if(!pending||dialogKind!=='start-mission'||!$('dialog').open||selected?.id!==pending.lessonId)return;closeModal();await begin(pending.mode);return;}if(action==='resume'){await resume(value);return;}
  if(!current)return;
  if(action==='leave'){requestLeave();return;}
  if(action==='show-summary'){closeModal();await pauseEntry();route='summary';render(true);return;}
  if(action==='retry-lesson'){selectLesson(current.lesson);return;}
  if(action==='repeat-independent'&&current.session.finished){selected=current.lesson;moduleId=selected.module_id;closeModal();showStartMission('independent');return;}
  if(action==='reload-kiosk'){if(current?.lesson.module_id==='kiosk'&&!frameReady&&!frameReloading){frameReloading=true;node.disabled=true;const entry=current,revision=++reloadRevision;try{await removeFrame();if(current===entry&&route==='work'&&revision===reloadRevision)createFrame();}finally{frameReloading=false;}}return;}
  if(action==='replay'){current.session.event('replays');updateContext();read();return;}
  if(action==='details'){stop();if(!details)current.session.event('details');details=!details;render();if(details)$('detail-panel')?.focus({preventScroll:false});return;}
  if(action==='hint'){stop();if(!hint)current.session.event('hints');hint=!hint;render();if(hint)$('hint-panel')?.focus({preventScroll:false});return;}
  if(action==='read-detail'){current.session.event('replays');updateContext();read('detail');return;}
  if(action==='coach-locate'&&current.model){OndiKioskCoach.locate($('content'));return;}
  if(action==='coach-toggle'&&current.model){if(isScene())current.model.ui={...(current.model.ui||{}),coachHidden:!current.model.ui?.coachHidden};else current.coachHidden=!current.coachHidden;render();return;}
  if(current.session.finished)return;
  if(action==='scenario'&&isScene()){const choice=node.dataset.choice;actScenario(value,['set','toggle-seat','venue-tab'].includes(value)?{field:node.dataset.field,value:choice}:value==='keypad'?{field:node.dataset.field,key:node.dataset.key}:value==='adjust'?{field:node.dataset.field,delta:node.dataset.delta}:value==='edit'?node.dataset.step:['choose-receipt','enter-kiosk'].includes(value)?choice:undefined);return;}
  if(action==='bank'){await actBank(value,value==='input-digit'?{field:node.dataset.field,key:node.dataset.key}:value==='preset-amount'?node.dataset.amount:undefined);return;}
  if(action==='history-done'){finishResult();stop();client.end();route='summary';render(true);return;}
  if(action==='key'){if(current.model.validated?.includes(current.model.targetIndex))return;actMessage('key',node.dataset.key);return;}
  if(action==='message'){actMessage(value);return;}
  if(action==='contact'){actMessage('contact',value);return;}
  if(action==='style'){actMessage('style',value);return;}
  if(action==='check'){stop();current.session.event();current.model=OndiMessage.validate(current.model,current.lesson,P);if(current.model.complete)finishResult();render();if(current.model.validated.includes(current.model.targetIndex))document.querySelector('[data-action="next-target"],[data-action="show-summary"]')?.focus({preventScroll:true});return;}
  if(action==='next-target'){stop();current.session.event();current.model=OndiMessage.next(current.model);details=false;hint=false;render(true);}
 });
 document.addEventListener('input',event=>{const sceneField=event.target.dataset.scenarioField;if(sceneField&&isScene()){actScenario('set',{field:sceneField,value:event.target.value});return;}const field=event.target.dataset.input;if(!field||!current||current.session.finished||event.target.tagName==='SELECT')return;current.session.event('corrections');current.model=OndiBank.act(current.model,field,event.target.value);render();});
 document.addEventListener('change',event=>{if(!event.target.matches?.('select[data-input="bank"]')||!current||current.session.finished)return;current.session.event('corrections');current.model=OndiBank.act(current.model,'bank',event.target.value);render();});
 document.addEventListener('toggle',event=>{if(event.target.matches?.('.utility-menu'))utilityOpen=event.target.open;if(event.target.matches?.('.bank-flow')&&current&&event.target.dataset.entry===current.session.id)current.pathExpanded=event.target.open;if(event.target.matches?.('.extra-help')&&current&&event.target.dataset.entry===current.session.id)current.helpExpanded=event.target.open;},true);
 $('dialog').addEventListener('cancel',event=>{event.preventDefault();closeModal();});
 document.addEventListener('keydown',event=>{if(event.key==='Escape'&&$('header').querySelector('.utility-menu')?.open){const menu=$('header').querySelector('.utility-menu');menu.open=false;utilityOpen=false;menu.querySelector('summary').focus();return;}if(event.key==='Escape'&&!$('dialog').open&&(details||hint)){event.preventDefault();stop();details=false;hint=false;render();$('details-toggle')?.focus({preventScroll:true});}});
 document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();if(route==='work'&&current?.lesson.module_id==='kiosk')sendFrame('silence');}});
 window.addEventListener('pagehide',()=>{stop();client.end();sendFrame('pause');});
 const headerObserver=typeof ResizeObserver==='function'?new ResizeObserver(()=>{document.documentElement.style.setProperty('--head',$('header').offsetHeight+'px');document.documentElement.style.setProperty('--kiosk-nav-h',$('kiosk-nav').offsetHeight+'px');}):null;headerObserver?.observe($('header'));headerObserver?.observe($('kiosk-nav'));
 configure();render();
 const query=new URLSearchParams(location.search);if(query.get('module')==='kiosk'){moduleId='kiosk';route='scenarios';render();}
 showHowTo();
 return {getState:()=>({route,moduleId,scenarioId,selected,current,kioskReady:frameReady,preferences:{...prefs},records:store.records.slice()}),getKeyboard:()=>P};
})();
</script></body></html>
