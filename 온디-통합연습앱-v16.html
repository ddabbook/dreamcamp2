:root {

}
* {box-sizing:border-box}
body {margin:0;background:var(--paper);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}

button.primary {background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover:enabled {background:var(--accent-dark);border-color:var(--accent-dark)}
button.guide {color:var(--accent-dark);border-color:#8ca5e5;background:var(--subtle)}
button.danger {color:#a22424;border-color:#b76565}
a {color:var(--accent-dark);text-underline-offset:4px}
h1,h2,h3,p {margin:0}

.vk-mobility-receipt>small{display:block;font-size:18px;line-height:1.6;color:#526a80;text-align:center}
.vk-mobility-receipt-plate{display:block;margin:14px auto;padding:12px 20px;border:2px solid #203d52;border-radius:6px;text-align:center;font-size:28px}
.vk-mobility-exit-time{margin:22px 0;padding:20px 14px;background:#fff6d6;font-size:21px;text-align:center;font-weight:700}

/* 기관별 화면: 민원발급기는 행정 안내판, 병원은 접수 현황판과 진료카드. */
.vk-public{--vk-accent:#1853a4;--vk-dark:#15324f;--vk-tint:#eef5fd;--vk-border:#b8cadb;color:#17324d;font-size:20px;line-height:1.55}
.vk-public *{box-sizing:border-box}
.vk-public svg{display:block;width:100%;height:100%}
.vk-public button{font:inherit;cursor:pointer}
.vk-public button:disabled{cursor:default;opacity:.5}
.vk-public button:focus-visible,.vk-public input:focus-visible{outline:4px solid #d88900;outline-offset:4px}
.vk-public .is-selected{border-color:var(--vk-accent);background:var(--vk-tint);box-shadow:inset 0 0 0 1px var(--vk-accent)}
.vk-public-masthead{display:flex;align-items:center;gap:18px;padding:22px 24px;background:var(--vk-dark);color:#fff;border-radius:12px 12px 0 0;margin:-1px -1px 0}
.vk-public-emblem{display:block;width:60px;height:60px;flex:0 0 60px;color:#a8cdfb}
.vk-public-masthead p{margin:0;color:#dceafa;font-size:18px}
.vk-public-masthead strong{font-size:clamp(22px,2.3vw,31px);letter-spacing:-.04em}
.vk-public-session{margin-left:auto;text-align:right;white-space:nowrap;font-size:18px;color:#edf5ff}
.vk-public-session b{display:block;font-size:18px;color:#c7e0ff;font-weight:500}
.vk-public-heading{padding:28px 0 24px}
.vk-public-heading>p{font-size:18px;color:var(--vk-accent);font-weight:750;margin:0 0 6px}
.vk-public-heading h2{margin:0 0 10px;font-size:clamp(27px,2.6vw,35px);color:var(--vk-dark);letter-spacing:-.04em;line-height:1.3}
.vk-public-heading>span{font-size:19px;color:#486077;display:block}
.vk-public .vk-public-choice-mark{width:29px;height:29px;min-width:29px;border:2px solid #7b8b9c;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#fff;color:#fff}
.vk-public .is-selected .vk-public-choice-mark{border-color:var(--vk-accent);background:var(--vk-accent)}
.vk-public-choice-mark svg{width:22px;height:22px;stroke-width:6}
.vk-public-field-label{display:block;font-size:22px;font-weight:750;margin:0 0 18px;padding:0}
.vk-public-notice{display:flex;gap:14px;align-items:flex-start;padding:20px 22px;border:1px solid #c6d4e3;background:#f4f7fb;border-radius:10px;margin-top:24px;color:#3b526b}
.vk-public-notice>svg{width:30px;height:30px;flex:0 0 30px;margin-top:2px}
.vk-public-notice p{font-size:18px;margin:0;line-height:1.7}
.vk-public-error{font-size:20px;margin-top:16px}
.vk-public .sk-form-actions{margin-top:30px;padding-top:24px;border-top:1px solid #cbd7e2}
.vk-public .sk-form-actions .sk-button{min-height:64px;font-size:22px}
.vkdoc-catalog{display:grid;grid-template-columns:180px minmax(0,1fr);border:1px solid #b8cadb;border-radius:10px;overflow:hidden}
.vkdoc-categories{display:flex;flex-direction:column;background:#edf3fa;border-right:1px solid #b8cadb}
.vk-public .vkdoc-category{min-height:79px;padding:20px 16px;background:transparent;border:0;border-bottom:1px solid #c7d5e5;border-radius:0;display:flex;align-items:center;justify-content:space-between;gap:8px;color:#29486b;font-size:21px;font-weight:700;text-align:left;box-shadow:none}
.vk-public .vkdoc-category:last-child{border-bottom:0}
.vk-public .vkdoc-category.is-selected{background:var(--vk-accent);color:#fff;box-shadow:none}
.vkdoc-category b{font-size:28px;line-height:1;font-weight:400}
.vkdoc-list{background:#fff;min-height:320px}
.vkdoc-list-label{padding:14px 24px;background:#f8fafc;display:flex;justify-content:space-between;gap:16px;font-size:18px;font-weight:700;color:#587089;border-bottom:1px solid #d8e1eb}
.vk-public .vkdoc-document{width:100%;min-height:102px;background:#fff;border:0;border-bottom:1px solid #d3deea;border-radius:0;display:flex;align-items:center;gap:16px;padding:20px 22px;text-align:left;box-shadow:none}
.vk-public .vkdoc-document:last-child{border-bottom:0}
.vk-public .vkdoc-document.is-selected{background:#e8f1fd;box-shadow:inset 4px 0 0 var(--vk-accent)}
.vkdoc-list-icon{width:39px;height:48px;flex:0 0 39px;color:#6285ae}
.vkdoc-list-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.vkdoc-list-copy strong{font-size:22px;color:#173a66;line-height:1.45}
.vkdoc-list-copy>span{font-size:18px;color:#516981}
.vkdoc-list-price{font-size:22px;font-weight:750;color:#244e7c;white-space:nowrap}
.vkdoc-info{padding:24px;background:#f1f6fc;border:1px solid #ccdced;border-radius:10px;margin-top:24px}
.vkdoc-info-title{display:flex;gap:16px;align-items:center;margin-bottom:20px}
.vkdoc-info-title>svg{width:46px;height:50px;color:#4579b5;flex:0 0 46px}
.vkdoc-info-title span{display:block;font-size:18px;color:#5c728b}
.vkdoc-info-title h3{margin:2px 0 0;font-size:24px;color:#173a66}
.vkdoc-info dl{display:grid;grid-template-columns:1fr 1fr;gap:12px 24px;margin:0}
.vkdoc-info dl>div{display:flex;gap:14px;align-items:flex-start}
.vkdoc-info dt{min-width:90px;color:#536c87;font-size:18px}
.vkdoc-info dd{margin:0;font-size:19px;font-weight:650;color:#203f62}
.vkdoc-info>p{font-size:18px;color:#536c87;margin:20px 0 0;border-top:1px solid #cedcea;padding-top:14px}
.vkdoc-info-empty{display:flex;align-items:center;gap:20px}
.vkdoc-info-empty>svg{width:52px;height:60px;flex:0 0 52px;color:#648bb9}
.vkdoc-info-empty>p{margin:0;padding:0;border:0}
.vkdoc-scope-layout,.vkdoc-copy-layout{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:28px;align-items:start}
.vkdoc-scope-options{display:flex;flex-direction:column;gap:16px}
.vk-public .vkdoc-scope-option{min-height:150px;width:100%;display:flex;align-items:center;gap:20px;padding:24px 20px;text-align:left;border:2px solid #b8cadb;border-radius:12px;background:#fff}
.vk-public .vkdoc-scope-option.is-selected{background:var(--vk-tint);border-color:var(--vk-accent)}
.vkdoc-scope-illustration{display:block;width:62px;height:62px;flex:0 0 62px;color:#517fae}
.vkdoc-scope-copy{display:flex;flex-direction:column;flex:1;gap:7px}
.vkdoc-scope-copy strong{font-size:23px;color:#163b65}
.vkdoc-scope-copy>span{font-size:18px;color:#516881}
.vkdoc-scope-copy em{font-size:18px;font-style:normal;font-weight:650;color:#42688c;background:#edf2f8;border-radius:6px;align-self:flex-start;padding:4px 9px}
.vkdoc-paper-caption{font-size:18px;color:#60738a;margin:0 0 10px}
.vkdoc-paper{position:relative;isolation:isolate;background:#fff;border:1px solid #bccadb;box-shadow:0 6px 18px #12304e12;padding:28px 25px;min-height:440px;overflow:hidden}
.vkdoc-paper-number{font-size:18px;color:#53677f;margin:0 0 24px}
.vkdoc-paper h3{text-align:center;font-size:26px;letter-spacing:.02em;margin:0 0 8px;color:#18334f;line-height:1.45}
.vkdoc-paper-subtitle{text-align:center;font-size:18px;color:#6b7a8c;margin:0 0 25px}
.vkdoc-paper dl{margin:0;border-top:2px solid #a5b6c9}
.vkdoc-paper dl>div{display:grid;grid-template-columns:98px minmax(0,1fr);gap:12px;padding:13px 0;border-bottom:1px solid #dce4ed;font-size:18px;position:relative}
.vkdoc-paper dt{color:#53677c}
.vkdoc-paper dd{margin:0;color:#263e58;font-weight:650;overflow-wrap:anywhere}
.vkdoc-watermark{position:absolute;z-index:-1;top:40%;left:5%;right:5%;transform:rotate(-26deg);font-size:clamp(70px,7vw,110px);color:#1659a010;font-weight:900;text-align:center;letter-spacing:.1em;pointer-events:none}
.vkdoc-paper-note{font-size:18px;color:#53687e;text-align:center;margin-top:24px;line-height:1.6}
.vkdoc-household{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;font-size:18px}
.vkdoc-household>span{background:#edf3f9;color:#46617e;padding:3px 8px;border-radius:4px}
.vk-public-number-entry{padding:24px;border:1px solid #c0d0e2;border-radius:12px;background:#f4f7fc}
.vk-public-number-entry>label{display:block;font-size:23px;font-weight:750;margin-bottom:16px}
.vkdoc-counter{display:flex;align-items:stretch;gap:10px}
.vk-public .vkdoc-adjust{min-height:68px;min-width:64px;padding:5px;background:#fff;border:1px solid #a9bfd8;border-radius:8px;font-size:35px;color:#1b518d;display:flex;align-items:center;justify-content:center}
.vkdoc-counter>div{display:flex;align-items:center;justify-content:center;flex:1;min-width:0;background:#fff;border:2px solid #6d94c4;border-radius:8px;padding:6px 8px}
.vkdoc-counter input{font:inherit;font-size:36px;font-weight:800;width:1.5em;max-width:100%;border:0;text-align:center;background:transparent;color:#163e70;padding:0;border-radius:0}
.vkdoc-counter>div>span{font-size:23px;font-weight:700;color:#3a6087}
.vk-public-number-entry>p{font-size:18px;color:#526b87;margin:12px 0 20px;text-align:center}
.vk-public-keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.vk-public .vk-public-key{min-height:66px;background:#fff;border:1px solid #b1c4dd;border-radius:8px;font-size:29px;color:#173c69;font-weight:700;display:flex;align-items:center;justify-content:center;padding:10px 3px}
.vk-public .vk-public-key.is-command{font-size:18px;background:#e6edf6}

/* 계좌 홈: 실제로 동작하는 송금·거래 내역만 표시합니다. */
.bank-phone[data-bank-phase=BANK_HOME] .bank-phone-scroll{background:#f4f6fa}
.bank-phone[data-bank-phase=BANK_HOME] .bank-screen{padding-top:23px}
.bank-phone[data-bank-phase=BANK_HOME] .bank-screen-intro{margin-bottom:23px}
.bank-phone[data-bank-phase=BANK_HOME] .bank-screen-intro>h2{font-size:26px}
.bank-phone .bank-account-card{position:relative;padding:24px;border:1px solid #253f69;border-radius:23px;background:linear-gradient(135deg,#243e68 0%,#172b4a 100%);box-shadow:0 9px 24px #19345b14;color:#fff;overflow:visible}
.bank-phone .bank-account-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:17px;color:#f3f6fd;font-weight:650}
.bank-phone .bank-account-tag{padding:3px 7px;border:1px solid #6b7f9c;border-radius:6px;background:transparent;color:#eef3fb;font-size:12px;font-weight:500;white-space:nowrap}
.bank-phone .bank-account-number{font-size:16px;color:#d0dbee;margin:8px 0 31px;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.bank-phone .bank-balance-label{font-size:14px;color:#d0dbee}
.bank-phone .bank-account-card .amount{display:block;font-size:37px;font-weight:750;line-height:1.3;color:#fff;margin:5px 0 23px;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.bank-phone .bank-card-action .primary{justify-content:space-between;background:#fff;border-color:#fff;border-radius:12px;min-height:55px;padding:12px 17px;color:#193658;font-size:19px;box-shadow:none}
.bank-phone .bank-card-action .primary:hover{background:#edf3ff}
.bank-phone .bank-card-action .bank-icon{width:21px;height:21px}
.bank-phone .bank-home-actions{display:block;margin-top:16px}
.bank-phone .bank-shortcut{display:flex;gap:13px;min-height:100px;padding:20px 15px;border:1px solid #e1e7ef;border-radius:20px;background:#fff;text-align:left;box-shadow:0 2px 7px #1a304704}
.bank-phone .bank-shortcut>span:nth-child(2){flex:1;min-width:0;color:#253a53;font-size:18px;font-weight:700}
.bank-phone .bank-shortcut small{display:block;margin-top:4px;color:#56657a;font-size:13px;font-weight:400;line-height:1.65}
.bank-phone .bank-shortcut>.bank-icon{width:17px;height:17px;color:#6c7c92}
.bank-phone .bank-shortcut-icon{display:grid;place-items:center;flex:none;width:43px;height:43px;border-radius:14px;background:#eff4ff;color:#315fba}
.bank-phone .bank-home-tip{display:flex;align-items:flex-start;gap:11px;margin:27px 6px 0;color:#56657a}
.bank-phone .bank-home-tip>span{display:grid;place-items:center;flex:none;width:32px;height:32px;background:#e8eef9;border-radius:10px;color:#4b6590}
.bank-phone .bank-home-tip .bank-icon{width:18px;height:18px}
.bank-phone .bank-home-tip strong{display:block;color:#3e526d;font-size:16px;font-weight:650;line-height:1.5}
.bank-phone .bank-home-tip p{font-size:14px;line-height:1.8;margin:4px 0 0}
.bank-phone .bank-tabbar{display:flex;align-items:center;gap:12px;border-top:1px solid #e8edf4;padding:10px 0 0}
.bank-phone .bank-tab{display:flex;flex:1;flex-direction:column;gap:5px;width:auto;min-height:60px;padding:8px 14px;border:0;border-radius:10px;background:transparent;color:#56657a;font-size:16px;font-weight:600}
.bank-phone .bank-tab .bank-icon{width:23px;height:23px}
.bank-phone .bank-tab[aria-current=page]{color:#2456d3;background:#f3f6ff}
.bank-phone .bank-tab:hover{background:#edf2fa}

/* 은행·계좌 입력과 고정 숫자판. */
.bank-phone .bank-field{display:block;margin:21px 0 0}
.bank-phone .bank-field>span{font-size:16px;color:#56657a;margin:0 0 8px}
.bank-phone .bank-field input,.bank-phone .bank-field select{font-size:23px;min-height:59px;padding:12px 14px;border:1px solid #c4d0df;border-radius:12px;background:#fff;color:#192b43;font-weight:650;letter-spacing:.015em}
.bank-phone .bank-field input::placeholder{font-size:20px;color:#68788e;font-weight:500;letter-spacing:-.025em}
.bank-phone .bank-field input:focus,.bank-phone .bank-field select:focus{border-color:#2456d3}
.bank-phone .bank-select-wrap{position:relative;display:block}
.bank-phone .bank-select-wrap select{appearance:none;-webkit-appearance:none;padding-right:42px;cursor:pointer}
.bank-phone .bank-select-wrap>.bank-icon{position:absolute;right:15px;top:18px;width:21px;height:21px;transform:rotate(90deg);pointer-events:none;color:#65758c}
.bank-phone .bank-account-field input{font-size:29px;font-variant-numeric:tabular-nums}
.bank-phone .bank-caption{font-size:16px;line-height:1.7;color:#56657a;margin:14px 0 0}
.bank-phone .bank-keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 7px;padding:8px 0 7px;margin:0;background:#fff}
.bank-phone .bank-digit{display:grid;place-items:center;min-height:54px;padding:8px;border:1px solid transparent;border-radius:13px;background:#fff;color:#1a2b41;font-size:29px;font-weight:500;line-height:1.3;font-variant-numeric:tabular-nums;box-shadow:none;transition:background .12s,transform .12s}
.bank-phone .bank-digit:hover{background:#f0f4fb}
.bank-phone .bank-digit[data-key=clear]{font-size:17px;color:#56657a}
.bank-phone .bank-digit[data-key=backspace]>.bank-icon{width:25px;height:25px}
.bank-phone .has-keypad{padding-top:7px;border-top:1px solid #edf1f6}
.bank-phone .bank-avatar{width:48px;height:48px;background:#edf3ff;border:1px solid #e2eafb;color:#365d9f;border-radius:18px;font-size:21px;font-weight:650}
.bank-phone .bank-recipient-found{gap:11px;padding:10px 0 0;margin-bottom:29px}
.bank-phone .bank-recipient-found>.bank-avatar{width:78px;height:78px;border-radius:29px;font-size:32px;margin-bottom:5px}
.bank-phone .bank-check-label{display:flex;align-items:center;gap:4px;margin:7px 0 0;color:#2858af;font-size:14px;font-weight:600}
.bank-phone .bank-check-label>.bank-icon{width:17px;height:17px}
.bank-phone .bank-recipient-found>strong{font-size:33px;font-weight:750;letter-spacing:-.04em;color:#192b43}
.bank-phone .bank-recipient-found>strong>span{font-size:23px;font-weight:500}
.bank-phone .bank-recipient-found>p{font-size:17px;color:#56657a}
.bank-phone .bank-recipient-reminder{padding:21px 18px;border-radius:17px;background:#f4f7fc;text-align:center}
.bank-phone .bank-recipient-reminder>strong{font-size:16px;font-weight:650;color:#3e526d}
.bank-phone .bank-recipient-reminder>p{font-size:15px;line-height:1.8;color:#56657a;margin:8px 0 0}
.bank-phone .bank-text{min-height:48px;padding:10px 7px;border:0;border-radius:9px;background:transparent;color:#486189;font-size:16px;font-weight:550;text-decoration:none;box-shadow:none}
.bank-phone .bank-text:hover{background:#f2f5fb;text-decoration:underline}
.bank-phone .bank-recipient-found~.bank-text{margin-top:12px}

/* 금액과 확인: 큰 숫자와 짧은 항목. */
.bank-phone .bank-to{display:flex;gap:12px;align-items:center;padding:0;margin:0 0 23px}
.bank-phone .bank-to strong{font-size:18px;color:#263c57;font-weight:650}
.bank-phone .bank-to p{font-size:14px;color:#56657a;margin:2px 0 0}
.bank-phone .bank-amount-field{margin-top:0}
.bank-phone .bank-amount-entry{display:flex!important;align-items:center;gap:8px;border-bottom:2px solid #2456d3;padding:0 0 4px}
.bank-phone .bank-amount-field input{min-width:0;flex:1;width:100%;height:58px;min-height:58px;border:0!important;border-radius:0;padding:4px 0;font-size:37px;font-weight:750;line-height:1.3;letter-spacing:-.035em;color:#192b43;background:transparent;font-variant-numeric:tabular-nums}
.bank-phone .bank-amount-field input::placeholder{font-size:37px;color:#8797ac;font-weight:650}
.bank-phone .bank-amount-entry>span{font-size:27px;font-weight:600;color:#263c57;flex:none}
.bank-phone .preview-amount{min-height:26px;font-size:16px;line-height:1.6;color:#315fb9;margin:11px 0 20px}
.bank-phone .bank-available{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0;padding:15px 16px;border-radius:12px;background:#f5f7fb;color:#56657a;font-size:14px}
.bank-phone .bank-available>strong{font-size:16px;font-weight:650;color:#324861;margin:0;white-space:nowrap}
.bank-phone .bank-quick-amounts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:5px 0 8px}
.bank-phone .bank-chip{min-height:41px;padding:8px;border:1px solid #e0e6f0;border-radius:10px;background:#f4f6fa;color:#425a7a;font-size:15px;font-weight:600}
.bank-phone .bank-transfer-heading{text-align:center;margin:7px 0 30px}
.bank-phone .bank-transfer-heading>span{font-size:20px;font-weight:500;color:#425671}
.bank-phone .bank-transfer-heading>strong{display:block;color:#192b43;font-size:39px;font-weight:750;line-height:1.4;margin:9px 0 0;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.bank-phone .bank-transfer-heading>p{font-size:16px;color:#56657a;margin:9px 0 0}
.bank-phone .bank-transfer-details{padding:8px 0;margin:0;border:0;border-top:1px solid #e4eaf2;border-bottom:1px solid #e4eaf2;border-radius:0;background:#fff}
.bank-phone .bank-transfer-details>div{display:flex;justify-content:space-between;gap:14px;align-items:baseline;padding:12px 0;border:0}
.bank-phone .bank-transfer-details dt{font-size:16px;min-width:86px;font-weight:400;color:#56657a}
.bank-phone .bank-transfer-details dd{font-size:17px;color:#263b54;font-weight:600;overflow-wrap:anywhere;margin:0;text-align:right}
.bank-phone .bank-account-digits{font-size:16px;font-weight:500;color:#56657a;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.bank-phone .bank-edit-links{gap:10px;margin:14px 0 0}
.bank-phone .bank-edit-links>.bank-button{flex:1;width:auto;min-height:45px;font-size:15px;background:#f4f6fa;color:#486189;padding:10px 8px}
.bank-phone .bank-review-note{font-size:14px;color:#56657a;text-align:center;line-height:1.8;margin:21px 0 0}
.bank-phone .bank-history-balance{border:0;border-radius:18px;background:#f2f5fc;padding:22px;margin:0 0 30px;color:#56657a;font-size:15px}
.bank-phone .bank-history-balance .amount{font-size:35px;color:#192b43;font-weight:750;margin:5px 0 0}
.bank-phone .bank-history-title{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}
.bank-phone .bank-history-title>h3{font-size:18px;margin:0;font-weight:700}
.bank-phone .bank-history-title>span{font-size:14px;color:#56657a}
.bank-phone .bank-history table{width:100%;font-size:15px;table-layout:fixed}
.bank-phone .bank-history th{font-size:13px;font-weight:500;color:#56657a;padding:8px 0;background:transparent;text-align:left;border-bottom:1px solid #e6ecf4}
.bank-phone .bank-history th:first-child{width:46%}
.bank-phone .bank-history th:nth-child(2){width:14%}
.bank-phone .bank-history th:last-child{text-align:right;width:40%}
.bank-phone .bank-history td{padding:18px 0;font-size:16px;color:#263b54;border-bottom:1px solid #e6ecf4;vertical-align:middle}
.bank-phone .bank-history td:first-child>span:last-child{display:block;overflow-wrap:anywhere}
.bank-phone .bank-history td:last-child{font-size:16px;letter-spacing:-.035em;font-variant-numeric:tabular-nums}
.bank-phone .bank-history-symbol{display:grid;place-items:center;width:32px;height:32px;margin-bottom:9px;border-radius:10px;background:#eff4ff;color:#315caa}
.bank-phone .bank-history-symbol>.bank-icon{width:18px;height:18px}
.bank-phone .bank-history-symbol.is-out{background:#f4f6fa;color:#56657a}
.bank-phone .bank-kind{font-size:13px;font-weight:550}
.bank-phone .bank-kind.is-in{color:#315caa}
.bank-phone .bank-kind.is-out{color:#56657a}

/* 모의 인증·처리·결과. */
.bank-phone .bank-demo-auth{display:flex;flex-direction:column;align-items:center;border:0;border-radius:0;background:#fff;padding:26px 0 0;margin:0}
.bank-phone .bank-fingerprint{display:grid;place-items:center;width:87px;height:87px;border-radius:30px;background:#edf3ff;color:#3a68c4;margin-bottom:16px}
.bank-phone .bank-fingerprint>svg{width:61px;height:61px}
.bank-phone .bank-demo-auth>strong{font-size:18px;font-weight:650;color:#2b415e}
.bank-phone .bank-demo-auth>p{font-size:14px;color:#56657a;line-height:1.8;margin:7px 0 0}
.bank-phone .bank-result-mark{display:grid;place-items:center;width:78px;height:78px;margin:5px auto 25px;border-radius:50%;background:#edf3ff;color:#2456d3;box-shadow:0 0 0 9px #f7f9ff}
.bank-phone .bank-result-mark>.bank-icon{width:38px;height:38px;stroke-width:2.5}
.bank-phone .bank-result-balance{border-top:1px solid #e4eaf2!important;margin-top:4px;padding-top:20px!important}
.bank-phone .bank-result-balance dd{color:#2456d3}
.bank-phone .bank-success{display:flex;align-items:center;gap:11px;margin:22px 0 0;padding:17px;border-radius:14px;border:0;background:#f2f6ff;color:#385c9a}
.bank-phone .bank-success>.bank-icon{width:19px;height:19px}
.bank-phone .bank-success p{margin:0;font-size:14px;line-height:1.8}
.bank-phone .bank-error-info{font-size:17px;color:#674515;border-radius:14px;margin-top:20px;background:#fff6e8;border:1px solid #ead2ac;padding:18px}
.bank-phone .bank-error-info>p{font-size:14px;line-height:1.8;margin:8px 0 0}
.bank-phone .bank-error{font-size:15px;line-height:1.8;border-radius:13px;margin:18px 0 0;padding:16px}
.bank-phone .bank-processing{display:flex;align-items:center;flex-direction:column;gap:17px;margin:12px 0 30px;padding:0;color:#56657a}
.bank-phone .bank-processing>p{font-size:15px;margin:0}
.bank-phone .bank-processing>.bank-spinner{display:block;width:42px;height:42px;border:4px solid #e8effd;border-top-color:#2456d3;border-radius:50%;animation:bank-spin 1s linear infinite}
@keyframes bank-spin{to{transform:rotate(360deg)}}

/* 큰 글씨에서는 화면 내용이 스크롤되고 숫자판/진행 버튼을 유지합니다. */
body.large .bank-phone .bank-screen-intro>h2{font-size:32px}
body.large .bank-phone .bank-greeting,body.large .bank-phone .bank-caption{font-size:19px}
body.large .bank-phone .bank-button{font-size:23px;min-height:66px}
body.large .bank-phone .bank-digit{min-height:61px;font-size:32px}
body.large .bank-phone .bank-digit[data-key=clear]{font-size:18px}
body.large .bank-phone .bank-header-back{width:44px;min-height:44px}
body.large .bank-phone .bank-field>span,body.large .bank-phone .bank-available{font-size:18px}
body.large .bank-phone .bank-field input,body.large .bank-phone .bank-field select{font-size:27px}
body.large .bank-phone .bank-amount-field input{font-size:39px}
body.large .bank-phone .preview-amount,body.large .bank-phone .bank-available>strong{font-size:19px}
body.large .bank-phone .bank-chip{min-height:48px;font-size:18px}
body.large .bank-phone .bank-transfer-details dt,body.large .bank-phone .bank-transfer-details dd{font-size:20px}
body.large .bank-phone .bank-edit-links>.bank-button{min-height:48px;font-size:18px}
body.large .bank-phone .bank-training-note{font-size:15px}
body.large .bank-phone .bank-tab{min-height:60px;font-size:17px}
body.large .bank-phone .bank-shortcut>span:nth-child(2){font-size:21px}
body.large .bank-phone .bank-shortcut small,body.large .bank-phone .bank-home-tip p,body.large .bank-phone .bank-recipient-reminder>p,body.large .bank-phone .bank-demo-auth>p,body.large .bank-phone .bank-review-note,body.large .bank-phone .bank-success p{font-size:17px}
body.large .bank-phone .bank-history th,body.large .bank-phone .bank-kind{font-size:16px}
body.large .bank-phone .bank-history td,body.large .bank-phone .bank-history td:last-child{font-size:19px}

body.contrast .bank-phone .bank-account-card,body.contrast .bank-phone .bank-history-balance,body.contrast .bank-phone .bank-transfer-details,body.contrast .bank-phone .bank-recipient-reminder{background:#fff;border:1px solid #101828;color:#101828}
body.contrast .bank-phone .bank-account-card :is(.bank-account-top,.bank-account-number,.bank-balance-label,.amount,.bank-account-tag){color:#101828}
body.contrast .bank-phone .bank-account-tag{border-color:#101828}
body.contrast .bank-phone .primary,body.contrast .bank-phone .bank-card-action .primary{background:#101828;border-color:#101828;color:#fff}
body.contrast .bank-phone :is(.bank-caption,.bank-greeting,.bank-training-note,.bank-available,.preview-amount,.bank-transfer-details dt,.bank-transfer-details dd,.bank-account-digits,.bank-review-note,.bank-home-tip p,.bank-home-tip strong,.bank-recipient-reminder>p,.bank-recipient-reminder>strong){color:#101828}
@media(max-width:760px){
 .bank-work .lesson-coach-slot,.bank-work .extra-help{max-width:408px}
 .bank-phone{width:408px;padding:6px;border-radius:42px}
 .bank-phone-display{border-radius:35px;height:810px}
 .bank-phone .bank-screen{padding:22px 20px 25px}
 .bank-phone .bank-bottom-panel{padding-left:20px;padding-right:20px}
 .bank-phone .bank-account-card{padding:22px 20px}
 .bank-phone .bank-account-top{font-size:16px}
 .bank-phone .bank-account-card .amount{font-size:35px}
 .bank-phone .bank-shortcut{padding:18px 12px;gap:10px}
 .bank-phone .bank-shortcut>span:nth-child(2){font-size:17px}
 .bank-phone .bank-shortcut small{font-size:12px}
 .bank-phone .bank-screen-intro>h2{font-size:27px}
 .bank-phone .bank-field input,.bank-phone .bank-field select{font-size:22px}
 .bank-phone .bank-amount-field input{font-size:35px}
 .bank-phone .bank-transfer-heading>strong{font-size:36px}
}
@media(max-width:390px){
 .bank-phone .bank-screen,.bank-phone .bank-bottom-panel{padding-left:17px;padding-right:17px}
 .bank-phone .bank-account-top{align-items:flex-start;gap:6px;font-size:15px}
 .bank-phone .bank-account-tag{font-size:11px}
 .bank-phone .bank-shortcut-icon{width:36px;height:36px;border-radius:12px}
 .bank-phone .bank-transfer-heading>strong{font-size:33px}
 .bank-phone .bank-history td,.bank-phone .bank-history td:last-child{font-size:14px}
 body.large .bank-phone .bank-history table{table-layout:auto}
 body.large .bank-phone .bank-history th,body.large .bank-phone .bank-history td{white-space:normal!important;overflow-wrap:anywhere}
}
@media(prefers-reduced-motion:reduce){.bank-phone .bank-spinner{animation:none!important}.bank-phone .bank-button,.bank-phone .bank-digit{transition:none}.bank-phone .bank-button:active,.bank-phone .bank-digit:active{transform:none}}

/* v10 — 시작 버튼 다음에 할 일을 확인하고 연습 화면 위에서 계속 볼 수 있습니다. */
.practice-prepare{max-width:850px;margin:25px auto 0;padding:27px}
.practice-prepare>.lead{margin-top:0}
.prepare-note{font-size:17px;color:#536375;line-height:1.8;margin:22px 0 0}
.practice-mission-banner{position:sticky;top:calc(var(--head,85px) + 10px);z-index:5;display:flex;align-items:center;gap:24px;padding:20px 23px;margin:0 0 30px;border:1px solid #c7d7f2;border-left:5px solid #315fba;border-radius:15px;background:#f0f5ff;color:#203c63;box-shadow:0 4px 14px #253e5f08}
.mission-banner-label{flex:none;min-width:95px;display:flex;flex-direction:column;gap:3px}
.mission-banner-label>strong{font-size:19px;font-weight:750;color:#234d96;line-height:1.6}
.mission-banner-label>span{font-size:14px;color:#536375}
.mission-banner-copy{flex:1;min-width:0}
.mission-banner-copy>.lesson-goal-text{font-size:21px;font-weight:650;line-height:1.7;white-space:pre-line;overflow-wrap:anywhere;margin:0;color:#203c63}
.mission-banner-note{font-size:16px;font-weight:400;color:#675027;line-height:1.7;margin:7px 0 0}
.mission-reopen{flex:none;min-height:48px;padding:11px 15px;border:1px solid #a6bcdf;border-radius:10px;background:#fff;color:#234d96;font-size:17px;line-height:1.6;font-weight:650;white-space:nowrap}
.mission-reopen:hover{background:#e3ecfc}
.practice-work .lesson-rail h1{margin-bottom:25px}
.scenario-work>.practice-mission-banner{margin-top:22px}
#kiosk-nav{position:sticky;top:var(--head,85px);z-index:6;background:#f4f6f8}
#kiosk-nav>.practice-mission-banner{position:static;margin:15px 0 0;box-shadow:none}
.mission-course{font-size:17px;color:#536375;margin:0 0 20px}
dialog[data-kind=start-mission]{max-width:min(720px,calc(100vw - 30px))}
dialog[data-kind=start-mission] .mission-title{font-size:25px;line-height:1.65;color:#192b43}
dialog[data-kind=start-mission] .mission-details{padding:6px 20px;background:#f3f6fc;border-radius:13px;font-size:20px}
dialog[data-kind=start-mission] .mission-details>div{grid-template-columns:140px minmax(0,1fr)}
dialog[data-kind=start-mission] .mission-details dt{font-size:17px;color:#536375}
dialog[data-kind=start-mission] .mission-details dd{font-size:21px;color:#203c63}
.start-mission-actions{margin-top:25px;display:flex;flex-direction:column;gap:10px}
.start-mission-actions>button{width:100%}

/* v13 — 은행과 같은 기기 프레임, 메시지 작성줄과 하단 자판. */
.type-work .lesson-coach-slot{max-width:470px;margin-left:auto;margin-right:auto}
.type-work .extra-help{max-width:430px}
.type-phone{
 --type-ink:#192b43;--type-muted:#56657a;--type-blue:#2456d3;
 position:relative;width:430px;max-width:100%;padding:8px;border:1px solid #727e8e;border-radius:48px;background:#17202c;overflow:visible;
 box-shadow:0 0 0 2px #d6dde5,0 0 0 3px #8d97a5,0 24px 55px -18px #16263d40,inset 0 0 0 1px #465364;
 color:var(--type-ink);font-size:18px;line-height:1.6;
}
.type-phone::before,.type-phone::after{content:'';position:absolute;width:3px;border-radius:3px;background:#75808e;z-index:-1}
.type-phone::before{left:-5px;top:132px;height:78px;box-shadow:0 90px 0 -1px #75808e}
.type-phone::after{right:-5px;top:168px;height:52px}
.type-phone-display{display:flex;flex-direction:column;height:850px;min-width:0;overflow:hidden;border-radius:39px;background:#fff;isolation:isolate}
.type-phone .type-icon{display:block;width:24px;height:24px;flex:none}
.type-phone .device-status{position:relative;display:flex;flex:none;align-items:center;justify-content:space-between;height:43px;padding:12px 22px 5px;background:#fff;color:#192b43;letter-spacing:0;font-size:14px;line-height:1}
.type-status-time{font-weight:750;letter-spacing:.02em}
.type-camera{position:absolute;left:50%;top:14px;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#101722;box-shadow:inset 0 0 0 2px #253548}
.type-status-icons{display:flex;align-items:center;gap:5px}
.type-status-icons>.type-icon{width:16px;height:16px;stroke-width:2}
.type-status-icons>.type-icon:last-child{width:21px;height:17px}
.type-phone .type-app-header{display:grid;grid-template-columns:44px minmax(0,1fr) 51px;gap:8px;align-items:center;flex:none;min-height:72px;padding:6px 15px 12px;border-bottom:1px solid #edf1f6;background:#fff}
.type-phone .type-header-title{min-width:0}
.type-phone .type-header-title>strong{display:block;font-size:21px;line-height:1.45;font-weight:750;letter-spacing:-.03em;color:#192b43;overflow-wrap:anywhere}
.type-phone .type-header-title>span{display:block;margin-top:2px;color:#56657a;font-size:12px;line-height:1.45}
.type-phone .type-header-back{display:grid;place-items:center;width:44px;min-height:44px;padding:9px;border:0;border-radius:12px;background:transparent;color:#263c57;box-shadow:none}
.type-phone .type-header-back:hover{background:#edf3ff}
.type-header-spacer{display:block;width:44px}
.type-phone .type-app-header>.type-training-tag{padding:4px 7px;border:1px solid #dce6f8;border-radius:7px;background:#f1f5ff;color:#355289;font-size:13px;font-weight:650;text-align:center;white-space:nowrap}
.type-phone .type-screen{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;padding:0;background:#fff}
.type-phone .type-phone-scroll{flex:1 1 auto;min-height:100px;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;scrollbar-width:thin;scrollbar-color:#c8d3e2 transparent;padding:24px 22px;background:#fff}
.type-phone .type-phone-scroll:focus-visible{outline:3px solid #b64d00;outline-offset:-4px}
.type-bottom-panel{flex:none;min-width:0;background:#fff;border-top:1px solid #edf1f6}
.type-phone-gesture{flex:none;display:grid;place-items:center;height:25px;background:#e9edf3}
.type-phone-gesture>span{display:block;width:108px;height:4px;border-radius:10px;background:#192b43}

/* 위의 목표와 아래의 입력: 자판을 누를 때 진행을 함께 봅니다. */
.type-target-card{border:1px solid #e0e7f3;border-radius:20px;padding:19px 19px 17px;background:#f5f7fc;min-width:0}
.type-target-top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.type-phone .type-screen .lesson-meter{margin:0;padding:0;background:transparent;color:#365d9f;font-size:14px;font-weight:700;line-height:1.6}
.type-target-state{display:flex;align-items:center;gap:3px;color:#56657a;font-size:13px}
.type-target-state.is-done{color:#166246;font-weight:650}
.type-target-state>.type-icon{width:16px;height:16px}
.type-target-progress{display:block;width:100%;height:4px;appearance:none;border:0;border-radius:5px;margin:14px 0 21px;overflow:hidden;background:#e0e7f3;accent-color:#2456d3}
.type-target-progress::-webkit-progress-bar{background:#e0e7f3;border-radius:5px}
.type-target-progress::-webkit-progress-value{background:#2456d3;border-radius:5px}
.type-target-progress::-moz-progress-bar{background:#2456d3;border-radius:5px}
.type-phone .type-target-card>h2{font-size:14px;font-weight:550;margin:0 0 6px;color:#56657a}
.type-phone .type-screen .typing-target{margin:0;padding:0;border:0;background:transparent;font-size:34px;line-height:1.65;letter-spacing:-.025em;color:#192b43;white-space:pre-wrap;overflow-wrap:anywhere}

.type-phone .type-compose{padding:14px 16px 5px}
.type-phone .type-input-field{min-width:0}
.type-phone .type-input-field>label.field{font-size:13px;color:#56657a;margin:0 0 7px;font-weight:550}
.type-phone .type-input-field>.typing-box{display:block;width:100%;height:76px;min-height:76px;max-height:140px;border:1px solid #c8d3e2;border-radius:14px;padding:10px 13px;background:#f7f9fc;color:#192b43;line-height:1.65;font-size:25px;letter-spacing:-.01em;resize:none;overflow-y:auto;white-space:pre-wrap}
.type-phone .typing-box::placeholder{font-size:16px;color:#56657a}
.type-phone .typing-box:focus-visible{outline:3px solid #b64d00;outline-offset:2px}
.type-phone .type-compose .type-input-actions{margin:10px 0 0;display:flex}
.type-phone .type-screen .type-input-actions>button{min-height:51px;padding:10px 14px;font-size:18px;border-radius:13px;background:#2456d3;border-color:#2456d3}
.type-phone .type-screen .composition-status{padding:5px 17px 8px;font-size:12px;line-height:1.6;color:#56657a;display:flex;justify-content:space-between;gap:5px;flex-wrap:wrap}
.type-phone .type-screen .type-inline-alert{margin:9px 16px 0;padding:8px 11px;border-radius:10px;font-size:14px;line-height:1.6;max-height:94px;overflow-y:auto}
.type-phone .type-screen .type-inline-alert.notice{background:#edf3ff;color:#334f6a;border:1px solid #dce6f8}
.type-phone .type-screen .keyboard{margin:0;border:0;border-top:1px solid #dce3ed;border-radius:0;padding:8px 12px 4px;background:#e9edf3}
.type-phone .type-screen .keyboard .key-modes{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-bottom:9px}
.type-phone .type-screen .keyboard .key-modes>button{min-height:33px;font-size:13px;padding:4px 8px;border:1px solid transparent;border-radius:7px;box-shadow:none;background:transparent;color:#56657a}
.type-phone .type-screen .keyboard .key-modes>button[aria-pressed=true]{background:#fff;color:#2456d3;border-color:#c8d3e2;font-weight:700}
.type-phone .type-screen .keyboard .key-grid{gap:7px}
.type-phone .type-screen .keyboard .key{min-height:57px;padding:8px 3px;border-radius:8px;border-color:#c6d0dc;font-size:26px;background:#fff;color:#273c51;box-shadow:0 2px 0 #bfc9d5}
.type-phone .type-screen .keyboard .key[data-key=ENTER],.type-phone .type-screen .keyboard .key[data-key=BACKSPACE]{font-size:26px;background:#dce3ed}
.type-phone .type-screen .keyboard .key[data-key=SPACE],.type-phone .type-screen .keyboard .key[data-key^=MODE_]{font-size:15px;letter-spacing:0}
.type-phone .type-screen .keyboard .key[data-key^=MODE_],.type-phone .type-screen .keyboard .key[data-key=PUNCT]{background:#dce3ed}
.type-phone .type-screen .keyboard .key[data-key=PUNCT]{font-size:17px}
.type-phone .type-screen .keyboard .key:active{background:#dce7f8;transform:translateY(1px);box-shadow:0 1px 0 #bfc9d5}
.type-phone .type-screen .keyboard .english-key-row .key{font-size:19px;min-height:52px;padding:8px 0}
.type-phone .type-screen .keyboard .english-tools .key{font-size:15px}

/* 메시지 목록·연락처: 모든 행과 주요 버튼은 기존 액션으로 동작합니다. */
.type-list-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 23px}
.type-phone .type-list-heading>h2{font-size:30px;font-weight:750;letter-spacing:-.04em;color:#192b43;margin:0}
.type-list-heading>span{font-size:13px;color:#56657a}
.type-list-caption{font-size:15px;line-height:1.7;color:#56657a;margin:-12px 0 25px}
.type-phone .type-screen .chat-list{display:grid;gap:0;margin:0}
.type-phone .type-screen .type-contact{display:flex;align-items:center;gap:13px;padding:17px 0;min-height:96px;width:100%;border:0;border-bottom:1px solid #edf1f6;border-radius:0;background:transparent;text-align:left;box-shadow:none;color:#192b43}

.type-avatar{display:grid;place-items:center;flex:none;width:52px;height:52px;border-radius:19px;background:#edf3ff;color:#365d9f;font-size:18px;font-weight:650;border:1px solid #e0e7f3;letter-spacing:-.04em}

.type-draft-label{color:#a32018;font-size:13px}
.type-contact>.type-icon{width:17px;height:17px;color:#56657a}
.type-empty-inbox{display:flex;align-items:center;flex-direction:column;justify-content:center;padding:65px 0 40px;text-align:center}
.type-inbox-icon{display:grid;place-items:center;width:76px;height:76px;background:#edf3ff;color:#365d9f;border-radius:25px;margin-bottom:22px}
.type-inbox-icon>.type-icon{width:35px;height:35px}
.type-empty-inbox>h3{font-size:21px;line-height:1.6;color:#192b43;font-weight:650;margin:0 0 9px;letter-spacing:-.025em}
.type-empty-inbox>p{font-size:16px;line-height:1.85;color:#56657a;margin:0}
.type-phone .type-list-actions{padding:18px 20px}
.type-phone .type-new-message{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:59px;font-size:19px;font-weight:650;padding:15px;border-radius:16px;background:#2456d3;border-color:#2456d3}
.type-phone .type-style-switch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding:12px 16px;border-top:1px solid #edf1f6}
.type-phone .type-style-switch>button{min-height:46px;font-size:13px;border-radius:11px;padding:8px 6px;border:1px solid #dce3ed;background:#f7f9fc;color:#56657a}
.type-phone .type-style-switch>button[aria-pressed=true]{color:#2456d3;border-color:#2456d3;background:#f1f5ff;font-weight:650}
.type-recipient-heading{margin:8px 0 32px}
.type-list-kicker{font-size:13px;font-weight:650;color:#365d9f}
.type-phone .type-recipient-heading>h2{font-size:27px;color:#192b43;line-height:1.6;font-weight:750;letter-spacing:-.035em;margin:9px 0}
.type-recipient-heading>p{font-size:15px;color:#56657a;margin:0;line-height:1.7}
.type-contacts-label{display:flex;justify-content:space-between;font-size:13px;color:#56657a;border-bottom:1px solid #edf1f6;padding-bottom:12px}

/* 대화 내용은 스크롤하고, 메시지 작성줄과 자판은 하단에 남습니다. */
.type-phone .type-conversation{display:flex;flex-direction:column;padding:22px 17px 16px;background:#f4f7fc}
.type-chat-date{align-self:center;background:#e9eef5;color:#56657a;border-radius:20px;padding:5px 13px;font-size:12px;line-height:1.5;margin:0 auto 22px}
.type-phone .type-screen .chat{display:flex;flex-direction:column;align-items:stretch;flex:1;min-height:0;padding:0;border:0;background:transparent;border-radius:0;gap:16px}
.type-empty-chat{align-self:center;display:flex;flex-direction:column;align-items:center;text-align:center;padding:18px 0;color:#56657a;margin:auto 0}
.type-empty-chat>span{display:grid;place-items:center;border:1px solid #c8d3e2;border-radius:19px;width:56px;height:56px;margin-bottom:12px}
.type-empty-chat p{font-size:15px;line-height:1.85;color:#56657a;margin:0}
.type-message-row{display:flex;flex-direction:column;align-items:flex-end;gap:5px;width:100%;margin:0}
.type-phone .type-screen .bubble{max-width:88%;border-radius:17px 3px 17px 17px;padding:12px 15px;margin:0;font-size:21px;line-height:1.7;overflow-wrap:anywhere;white-space:pre-wrap;background:#dfeaf8;color:#1a3c65;border:1px solid #c4d5eb}

.type-room-contact{display:flex;justify-content:center;margin-top:17px}
.type-phone .type-contact-change{padding:6px 13px;min-height:40px;font-size:13px;line-height:1.5;border:1px solid #c8d3e2;border-radius:20px;background:#fff;color:#56657a;box-shadow:none}
.type-phone .type-message-compose{display:flex;align-items:flex-end;gap:9px;padding:12px 13px 3px}
.type-phone .type-message-compose>.type-input-field{flex:1}
.type-phone .type-message-compose .typing-box{height:70px;min-height:70px;border-radius:19px;background:#fff;font-size:22px;padding:11px 13px}
.type-phone .type-send{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex:none;width:60px;min-height:63px;padding:8px 3px;border-radius:19px;background:#2456d3;border-color:#2456d3;color:#fff;box-shadow:none}

.type-message-state{text-align:center;padding:19px 19px 21px;color:#192b43}
.type-message-state>strong{font-size:18px;line-height:1.7;font-weight:650}
.type-message-state>p{font-size:14px;line-height:1.7;color:#56657a;margin:8px 0 0}
.type-phone .type-message-state .actions{margin:15px 0 0;gap:9px}
.type-phone .type-message-state .actions>button{min-height:55px;padding:12px;font-size:17px;border-radius:14px;flex-basis:100%}
.type-phone .type-message-state .actions>.primary{background:#2456d3;border-color:#2456d3}
.type-phone .type-pending-text{white-space:pre-wrap;overflow-wrap:anywhere;max-height:100px;overflow-y:auto}
.type-delivered-check{display:grid;place-items:center;width:33px;height:33px;border-radius:50%;margin:0 auto 9px;background:#eaf5f0;color:#166246}

nu = getMenu(item.menuId,item.store);\n  if (!menu) return 0;\n  return menu.price + (menu.category === 'burger' && item.type === 'set' ? SET_EXTRA + (getMenu(item.sideId)?.extra || 0) + (getMenu(item.drinkId)?.extra || 0) : 0);\n}\nconst itemTotal = item => unitPrice(item) * item.qty;\nconst cartTotal = () => state.cart.reduce((sum,item) => sum + itemTotal(item),0);\nfunction normalized(item) {\n  const menu=getMenu(item.menuId),set=menu.category==='burger'&&item.type==='set';\n  const lineId=item.id||item.line_id||uid();\n  return {id:lineId,line_id:lineId,store:state.active?.store||settings.store||'A',menuId:item.menuId,type:set?'set':'single',sideId:set?(item.sideId||'potato'):null,drinkId:set?(item.drinkId||'cola'):null,qty:Math.max(1,Math.min(9,Number(item.qty)||1))};\n}\nfunction components(item) {\n  return item.type === 'set' ? `세트 · ${getMenu(item.sideId,item.store).name} + ${getMenu(item.drinkId,item.store).name}` : getMenu(item.menuId,item.store).category === 'burger' ? '단품 · 버거만' : '단품';\n}\nfunction taskMatches(task,place,cart) {\n  if (place !== 'store' || cart.length === 0) return false;\n  const correctComposition = cart.every(i =>\n    i.menuId === 'bulgogi' && i.type === 'set' && i.sideId === 'potato' &&\n    i.drinkId === (task === 'B' ? 'zero' : 'cola')\n  );\n  return correctComposition && cart.reduce((sum,i) => sum+i.qty,0) === (task === 'B' ? 2 : 1);\n}\n\n// 3. 주문 상태: 수정할 때는 복사본만 바꾸고, 저장 시 해당 메뉴만 교체합니다.\nconst state = {screen:'home',history:[],place:null,group:'all',tab:'burger',draft:null,cart:[],editId:null,editField:null,returnScreen:'cart',placeReturn:null,active:null,lastRecord:null,paymentError:false,voice:false,large:false,highlight:false,staff:false};\nlet settings = {participant:'P01',task:'A',mode:'guided',paymentError:false,store:'A',compact:true,speechProvider:'browser',rate:.9,volume:.7,voiceName:'',enableVoice:true,allowBrowserFallback:true,highContrast:false};\nlet records = [];\nlet storageAvailable = true;\nlet storageIssue = '';\nlet dialogKind = null;\nlet returnFocus = null;\nlet pending = null;\nlet toastTimer = null;\nlet adminError = '';\n\n// 4. 기록 저장: 저장이 제한되어도 페이지 안에서 주문과 기록을 이어갑니다.\nfunction loadStorage() {\n  try {\n    const raw = localStorage.getItem(STORE_KEY);\n    if (raw) {\n      const loaded = JSON.parse(raw);\n      if (!Array.isArray(loaded)) throw new Error('기록 형식 오류');\n      records = loaded.filter(r => r && typeof r.id === 'string' && ['completed','aborted'].includes(r.status) && ['guided','normal'].includes(r.mode) && ['A','B'].includes(r.task) && /^P\\d{2,4}$/.test(r.participant) && Number.isFinite(r.durationMs) && Array.isArray(r.cart) && r.cart.every(i => getMenu(i.menuId) && Number.isInteger(i.qty) && i.qty >= 1 && i.qty \u003c= 9 && (i.type !== 'set' || (getMenu(i.sideId)?.category === 'side' && getMenu(i.drinkId)?.category === 'drink'))));\n    }\n    const config = JSON.parse(localStorage.getItem(CONFIG_KEY) || 'null');\n    if (config && /^P\\d{2,4}$/.test(config.participant) && ['A','B'].includes(config.task) && ['guided','normal'].includes(config.mode)) settings = {...settings,...config,paymentError:!!config.paymentError};\n    localStorage.setItem('hangeol-storage-check','1');\n    localStorage.removeItem('hangeol-storage-check');\n  } catch (e) { storageAvailable=false; storageIssue='브라우저 저장 제한'; }\n}\nfunction persist() {\n  if (!storageAvailable) return;\n  try { localStorage.setItem(STORE_KEY,JSON.stringify(records)); localStorage.setItem(CONFIG_KEY,JSON.stringify(settings)); }\n  catch(e) { storageAvailable=false; storageIssue='브라우저 저장 실패'; }\n}\nfunction countChange(oldValue,newValue) {\n  if (state.active && oldValue !== null && oldValue !== undefined && oldValue !== newValue) state.active.changes++;\n}\nfunction startTrialBase() {\n  if (state.active) return;\n  state.cart=[];state.place=null;state.group='all';state.tab='burger';state.draft=null;state.editId=null;state.editField=null;state.placeReturn=null;state.history=[];state.paymentError
